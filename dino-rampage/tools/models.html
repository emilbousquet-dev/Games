<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Rampage Models</title>
<style>
  html, body { margin: 0; height: 100%; background: #9ad8ff; overflow: hidden; font-family: sans-serif; }
  #info { position: fixed; left: 10px; top: 10px; background: rgba(255,255,255,0.85); padding: 8px 12px; border-radius: 10px; font-size: 14px; }
</style>
</head>
<body>
<div id="info">Dino Rampage — all the models. Drag to spin, scroll to zoom. <b>?show=dinos</b> for the dino closet.</div>
<script src="../../lib/three.min.js"></script>
<script src="../js/util.js"></script>
<script src="../js/textures.js"></script>
<script src="../js/models.js"></script>
<script>
  const Mo = DR.Models;
  const params = new URLSearchParams(location.search);
  const show = params.get('show') || 'props';
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9ad8ff);
  scene.add(new THREE.HemisphereLight(0xdff0ff, 0x6a8a4a, 1.4));
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.2);
  sun.position.set(30, 60, 40); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, far: 300 });
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x7ac85a }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
  let yaw = 0.5, pitch = 0.45, dist = 150, target = new THREE.Vector3(0, 6, 0);
  const dinos = [];
  if (show === 'dinos') {
    Mo.SKINS.forEach((s, i) => {
      const d = Mo.dino(s.id, Mo.HATS[(i + 1) % Mo.HATS.length].id);
      d.position.set((i - 2.5) * 2.2, 0, 0); scene.add(d); dinos.push(d);
    });
    Mo.HATS.forEach((h, i) => {
      const d = Mo.dino('green', h.id);
      d.position.set((i - 3.5) * 2.2, 0, -4); scene.add(d); dinos.push(d);
    });
    for (let i = 0; i < 12; i++) { const p = Mo.person(i); p.position.set((i - 6) * 0.8, 0, 3); scene.add(p); Mo.animatePerson(p, 0.1, { speed: 0, panic: i % 3 === 0, wave: i % 3 === 1 }); }
    dist = 13; target.set(0, 1, 0); pitch = 0.25;
  } else {
    const list = ['fence', 'mailbox', 'trashcan', 'hydrant', 'bench', 'bush', 'flowers', 'gnome', 'trafficcone', 'newsbox', 'beachumbrella', 'sandcastle', 'beachball', 'picnictable', 'doghouse',
      'watermelon', 'donut', 'cake', 'hotdog', 'pizza', 'icecream', 'burger',
      'car', 'car', 'tree', 'tree', 'lamppost', 'phonebooth', 'busstop', 'slide', 'trampoline', 'lifeguard', 'hotdogcart', 'booth', 'icecreamstand',
      'house', 'house', 'bus', 'truck', 'icecreamtruck', 'fountain', 'gasstation', 'carousel',
      'shop', 'apartment', 'watertower', 'tower', 'tower', 'hotel', 'lighthouse', 'ferris',
      'fbibase', 'sandbags', 'crates', 'pudding', 'jeep', 'fueltank', 'flagpole', 'armytank', 'barracks', 'hangar', 'radar', 'controltower'];
    const variants = { car: ['taxi', 'van', 'fbi'], tree: ['pine', 'palm'], booth: ['cotton'], shop: ['burger', 'donut', 'pudding'], tower: ['deco', 'tall'] };
    const used = {};
    let x = -60, z = 40, rowD = 0;
    const place = (kind, v) => {
      const p = Mo.prop(kind, Math.random, v);
      if (x + p.w > 70) { x = -60; z -= rowD + 6; rowD = 0; }
      p.mesh.position.set(x + p.w / 2, 0, z - p.d / 2);
      scene.add(p.mesh);
      if (p.spin) dinos.push({ spin: p.spin });
      x += p.w + 3; rowD = Math.max(rowD, p.d);
    };
    const only = params.get('only');
    for (const k of only ? only.split(',') : list) { const n = used[k] = (used[k] || 0); used[k]++; place(k, variants[k] && n > 0 ? variants[k][(n - 1) % variants[k].length] : undefined); }
    if (!params.get('only')) for (const [k, vs] of Object.entries(variants)) for (const v of vs.slice(1)) place(k, v);
    // army vehicles that move
    [Mo.unitTank(), Mo.unitJeep(), Mo.unitHeli()].forEach((u, i) => { u.root.position.set(-50 + i * 14, i === 2 ? 4 : 0, 60); scene.add(u.root); });
    if (only) { dist = +params.get('dist') || 70; target.set(0, 4, 20); }
  }
  let drag = false, lx = 0, ly = 0;
  addEventListener('mousedown', (e) => { drag = true; lx = e.clientX; ly = e.clientY; });
  addEventListener('mouseup', () => { drag = false; });
  addEventListener('mousemove', (e) => { if (!drag) return; yaw -= (e.clientX - lx) * 0.005; pitch = Math.max(0.05, Math.min(1.5, pitch + (e.clientY - ly) * 0.005)); lx = e.clientX; ly = e.clientY; });
  addEventListener('wheel', (e) => { dist *= e.deltaY > 0 ? 1.1 : 0.9; });
  const clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    cam.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    cam.lookAt(target);
    dinos.forEach((d, i) => { if (d.spin) d.spin.rotation.z += dt * 0.3; else Mo.animateDino(d, dt, { walk: 0, look: 0 }); });
    renderer.render(scene, cam);
  }
  loop();
</script>
</body>
</html>

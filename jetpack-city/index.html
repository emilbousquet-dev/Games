<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0620">
<title>Jetpack City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen 3D city, with thumb-sized buttons at the bottom and the score at the top. */
  :root {
    --night: #0b0620;       /* the sky behind everything */
    --panel: #160c34;       /* menu panels */
    --pink: #ff3aa8;        /* neon sign pink */
    --cyan: #3af0ff;        /* lane-line cyan */
    --bolt: #ffd21a;        /* energy bolt yellow */
    --danger: #ff2a3a;      /* MEGA-BOT red */
    --text: #f2eeff;
    --muted: #a99cd8;
    --display: 'Russo One', Impact, 'Arial Black', sans-serif;
    --body: 'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); overflow: hidden; font-family: var(--body);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; z-index: 20;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px); pointer-events: none; }
  .screen.show { display: flex; }
  .screen > * { pointer-events: auto; }

  button { font-family: var(--display); color: var(--night); border: none; cursor: pointer; letter-spacing: 1px; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  .btn { font-size: 26px; padding: 16px 30px; border-radius: 18px; background: var(--bolt); min-width: min(280px, 100%);
    box-shadow: 0 6px 0 #a0780a, 0 0 28px rgba(255, 210, 26, 0.35); transition: transform 0.08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a0780a; }
  .btn.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 #9a1a62, 0 0 24px rgba(255, 58, 168, 0.35); font-size: 20px; padding: 13px 22px; min-width: 0; }
  .btn.pink:active { box-shadow: 0 2px 0 #9a1a62; }
  .btn.ghost { background: rgba(22, 12, 52, 0.85); color: var(--text); border: 2px solid var(--cyan); box-shadow: 0 0 16px rgba(58, 240, 255, 0.25); font-size: 17px; padding: 11px 16px; min-width: 0; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---------- title ---------- */
  .logo { font-family: var(--display); text-align: center; line-height: 0.86; margin-top: 2vh; transform: rotate(-4deg); }
  .logo .l1 { display: block; font-size: min(17vw, 96px); color: #fff; letter-spacing: 2px;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--pink), 0 0 40px var(--pink), 4px 5px 0 #5a0a3a; }
  .logo .l2 { display: block; font-size: min(21vw, 118px); color: var(--cyan); letter-spacing: 6px;
    text-shadow: 0 0 6px #d8ffff, 0 0 22px var(--cyan), 0 0 44px #1a8aff, 4px 5px 0 #0a2a5a; animation: flicker 5s infinite; }
  @keyframes flicker { 0%, 91%, 95%, 100% { opacity: 1; } 93% { opacity: 0.45; } }
  .tag { margin-top: 12px; font-size: 17px; font-weight: 600; color: var(--text); text-align: center; text-shadow: 0 2px 8px #000; }
  .tag b { color: var(--danger); }
  .spacer { flex: 1; }
  .stats { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .chip { background: rgba(11, 6, 32, 0.8); border: 1px solid rgba(169, 156, 216, 0.4); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .chip .k { color: var(--muted); font-weight: 600; margin-right: 6px; letter-spacing: 1px; font-size: 12px; }
  .chip.bolt { color: var(--bolt); }
  .menu { display: flex; flex-direction: column; gap: 14px; align-items: center; width: min(360px, 100%); }
  .menu .row { width: 100%; }
  .menu .row .btn { flex: 1; }
  .howto { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; }

  /* ---------- garage ---------- */
  #garage h2 { font-family: var(--display); font-size: 40px; margin: 0; color: var(--bolt); text-shadow: 0 0 18px rgba(255, 210, 26, 0.6); letter-spacing: 3px; }
  .tabs { display: flex; gap: 8px; margin: 10px 0 0; }
  .tab { font-size: 15px; padding: 9px 16px; border-radius: 999px; background: rgba(22, 12, 52, 0.9); color: var(--muted); border: 2px solid rgba(169, 156, 216, 0.35); }
  .tab.on { color: var(--night); background: var(--cyan); border-color: var(--cyan); }
  .shelf { display: flex; gap: 10px; overflow-x: auto; width: 100%; max-width: 720px; padding: 6px 2px 10px; scroll-snap-type: x mandatory; touch-action: pan-x; }
  .card { flex: 0 0 132px; scroll-snap-align: center; background: rgba(22, 12, 52, 0.92); border: 2px solid rgba(169, 156, 216, 0.3); border-radius: 16px;
    padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text); font-family: var(--body); letter-spacing: 0; }
  .card.on { border-color: var(--bolt); box-shadow: 0 0 18px rgba(255, 210, 26, 0.35); }
  .card.locked .sw { filter: saturate(0.4) brightness(0.7); }
  .sw { width: 58px; height: 58px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.8); }
  .card .nm { font-weight: 700; font-size: 14px; text-align: center; line-height: 1.1; min-height: 31px; display: flex; align-items: center; }
  .card .pr { font-family: var(--display); font-size: 14px; color: var(--bolt); font-variant-numeric: tabular-nums; }
  .card .pr.eq { color: var(--cyan); }
  .card .pr.no { color: #8a7aa8; }
  .gnote { min-height: 22px; font-weight: 700; color: var(--pink); text-shadow: 0 2px 6px #000; margin-bottom: 4px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
  #hud.show { display: block; }
  .topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0; }
  .score { font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px var(--pink), 0 3px 0 #000; }
  .score small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); letter-spacing: 2px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .bolts { margin-left: auto; font-family: var(--display); font-size: 26px; color: var(--bolt); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255, 210, 26, 0.7), 0 3px 0 #000; padding-top: 2px; }
  #pauseBtn { pointer-events: auto; width: 46px; height: 46px; border-radius: 14px; background: rgba(22, 12, 52, 0.8); border: 2px solid rgba(242, 238, 255, 0.5); color: var(--text); font-size: 18px; }
  .chase { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 14px; right: 14px; height: 26px; }
  .chase .track { position: absolute; left: 22px; right: 22px; top: 11px; height: 4px; border-radius: 2px; background: rgba(242, 238, 255, 0.2); }
  .chase .me, .chase .bot { position: absolute; top: 0; font-size: 20px; line-height: 26px; transform: translateX(-50%); }
  .chase .me { right: -2px; left: auto; transform: none; }
  .chase .bot { left: 12px; transition: left 0.2s linear; filter: drop-shadow(0 0 6px var(--danger)); }
  .powers { position: absolute; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-direction: column; gap: 8px; }
  .pw { display: flex; align-items: center; gap: 8px; background: rgba(11, 6, 32, 0.75); border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: 14px; }
  .pw i { font-style: normal; font-size: 20px; }
  .pw .bar { width: 80px; height: 7px; border-radius: 4px; background: rgba(242, 238, 255, 0.2); overflow: hidden; }
  .pw .bar b { display: block; height: 100%; background: var(--c, var(--cyan)); border-radius: 4px; }
  .pop { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-size: min(11vw, 54px); opacity: 0; transform: scale(0.6);
    transition: opacity 0.2s, transform 0.25s; text-shadow: 0 0 20px currentColor, 0 4px 0 #000; padding: 0 16px; }
  .pop.show { opacity: 1; transform: scale(1); }
  .hint { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 100px); transform: translateX(-50%); width: min(92vw, 400px); text-align: center; background: rgba(11, 6, 32, 0.85);
    border: 2px solid var(--cyan); border-radius: 14px; padding: 8px 14px; font-weight: 700; font-size: 17px; opacity: 0; transition: opacity 0.3s; box-shadow: 0 0 20px rgba(58, 240, 255, 0.3); }
  .hint.show { opacity: 1; }
  .taunt { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12%); text-align: center; font-family: var(--display); font-size: min(7vw, 30px); color: var(--danger); opacity: 0; transition: opacity 0.3s;
    text-shadow: 0 0 14px var(--danger), 0 3px 0 #000; padding: 0 16px; }
  .taunt.show { opacity: 1; }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 6; background: #fff; opacity: 0; }
  #flash.go { animation: flash 0.9s ease-out; }
  @keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
  .score small.planet { color: var(--text); letter-spacing: 1px; margin-top: 2px; }
  #danger { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0; background: radial-gradient(ellipse at center, rgba(255, 0, 30, 0) 50%, rgba(255, 0, 30, 0.55) 100%); }

  /* ---------- panels: pause, game over ---------- */
  .dim { background: rgba(5, 2, 16, 0.55); justify-content: center; }
  .panel { background: var(--panel); border: 2px solid var(--pink); border-radius: 22px; padding: 22px 20px; width: min(380px, 100%); text-align: center;
    box-shadow: 0 0 40px rgba(255, 58, 168, 0.3); display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .panel h2 { font-family: var(--display); margin: 0; font-size: 36px; line-height: 1; color: var(--danger); text-shadow: 0 0 16px rgba(255, 42, 58, 0.6); text-wrap: balance; }
  .panel h2.cyan { color: var(--cyan); text-shadow: 0 0 16px rgba(58, 240, 255, 0.6); }
  .big { font-family: var(--display); font-size: 58px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px var(--pink); }
  .big small { display: block; font-family: var(--body); font-size: 13px; letter-spacing: 3px; color: var(--muted); font-weight: 700; text-shadow: none; margin-top: 4px; }
  .lines { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lines span:nth-child(odd) { text-align: left; color: var(--muted); }
  .lines span:nth-child(even) { text-align: right; }
  .record { font-family: var(--display); color: var(--bolt); font-size: 22px; animation: pulse 0.6s ease-in-out infinite alternate; text-shadow: 0 0 14px rgba(255, 210, 26, 0.7); }
  @keyframes pulse { to { transform: scale(1.1); } }
  .panel .btn { width: 100%; }

  @media (prefers-reduced-motion: reduce) { .logo .l2, .record { animation: none; } }
  @media (orientation: landscape) and (max-height: 500px) {
    .logo .l1 { font-size: 12vh; } .logo .l2 { font-size: 15vh; } .tag { display: none; } .menu { gap: 8px; } .btn { padding: 10px 24px; font-size: 22px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="danger"></div>
<div id="flash"></div>

<!-- TITLE -->
<div id="title" class="screen">
  <div class="logo"><span class="l1">JETPACK</span><span class="l2">CITY</span></div>
  <div class="tag">Run, Ratchet! Grab the bolts! <b>MEGA-BOT</b> is coming!</div>
  <div class="spacer"></div>
  <div class="stats">
    <div class="chip"><span class="k">BEST</span><span id="tBest">0</span></div>
    <div class="chip bolt"><span class="k">BOLTS</span>🔩 <span id="tBank">0</span></div>
  </div>
  <div class="menu">
    <button class="btn" id="playBtn">PLAY</button>
    <div class="row">
      <button class="btn pink" id="garageBtn">GARAGE</button>
      <button class="btn ghost" id="soundBtn">🔊</button>
      <button class="btn ghost" id="gfxBtn">✨ PRETTY</button>
    </div>
  </div>
  <div class="howto">Swipe ⬅ ➡ lanes · ⬆ hop · ⬇ slide (keyboard: arrows)</div>
</div>

<!-- GARAGE -->
<div id="garage" class="screen">
  <h2>GARAGE</h2>
  <div class="chip bolt"><span class="k">YOUR BOLTS</span>🔩 <span id="gBank">0</span></div>
  <div class="tabs">
    <button class="tab on" id="tabJet">CLANK</button>
    <button class="tab" id="tabSuit">RATCHET</button>
  </div>
  <div class="spacer"></div>
  <div class="gnote" id="gNote"></div>
  <div class="shelf" id="shelf"></div>
  <button class="btn" id="garageBack">DONE</button>
</div>

<!-- HUD (while running) -->
<div id="hud">
  <div class="topbar">
    <div class="score"><span id="hScore">0</span><small id="hDist">0 m</small><small id="hPlanet" class="planet">🪐 Veldin</small></div>
    <div class="bolts">🔩 <span id="hBolts">0</span></div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
  </div>
  <div class="chase" aria-hidden="true"><div class="track"></div><span class="bot" id="hBot">🤖</span><span class="me">🦊</span></div>
  <div class="powers" id="hPowers"></div>
  <div class="pop" id="hPop"></div>
  <div class="hint" id="hHint"></div>
  <div class="taunt" id="hTaunt"></div>
</div>

<!-- PAUSE -->
<div id="pause" class="screen dim">
  <div class="panel">
    <h2 class="cyan">PAUSED</h2>
    <button class="btn" id="resumeBtn">KEEP RUNNING</button>
    <button class="btn ghost" id="pSoundBtn">🔊 SOUND ON</button>
    <button class="btn pink" id="quitBtn">QUIT TO MENU</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="over" class="screen dim">
  <div class="panel">
    <h2 id="oTitle">MEGA-BOT GOT YOU!</h2>
    <div class="big"><span id="oScore">0</span><small>SCORE</small></div>
    <div class="record" id="oRecord" hidden>★ NEW RECORD! ★</div>
    <div class="lines">
      <span>Distance</span><span id="oDist">0 m</span>
      <span>Bolts</span><span id="oBolts">🔩 0</span>
      <span>Planets visited</span><span id="oPlanets">🪐 1</span>
      <span>Best score</span><span id="oBest">0</span>
    </div>
    <button class="btn" id="againBtn">RUN AGAIN</button>
    <div class="row" style="width:100%">
      <button class="btn pink" id="menuBtn" style="flex:1">MENU</button>
      <button class="btn ghost" id="oGarageBtn" style="flex:1">GARAGE</button>
    </div>
  </div>
</div>

<script src="../lib/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/map.js"></script>
<script src="js/textures.js"></script>
<script src="js/models.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/chaser.js"></script>
<script src="js/hud.js"></script>
<script src="js/game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Army Tycoon</title>
<!--
  ROBOT ARMY TYCOON
  Build a factory, make money, build robots, send your army to battle.
  Everything (pictures, sounds, online play) is made with code in this one file,
  so you can paste the whole file into Google Sites: Insert > Embed > Embed code.
-->
<style>
:root {
  --bg: #0f1420; --bg2: #161d2d; --panel: #1f2738; --panel2: #283247; --line: #3a4760;
  --text: #eef3ff; --dim: #9fb0cc; --gold: #ffcc33; --gold2: #ff9d1c; --green: #4dff88;
  --red: #ff4d5e; --blue: #4db8ff; --purple: #b57bff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; overflow: hidden;
  user-select: none; -webkit-user-select: none; }
input { user-select: text; -webkit-user-select: text; }
button { font-family: inherit; }
#app { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); display: flex; flex-direction: column; min-width: 320px; }

/* ---------- top bar ---------- */
#top { display: flex; align-items: center; gap: 10px; padding: 6px 10px; flex-wrap: wrap;
  background: linear-gradient(#2b3550, #1a2133); border-bottom: 3px solid #0a0e17; }
.logo { font-weight: 900; font-style: italic; letter-spacing: 1px; font-size: 16px;
  background: linear-gradient(#fff6c2, #ffcc33 45%, #ff8a1c); -webkit-background-clip: text; background-clip: text;
  color: transparent; filter: drop-shadow(0 2px 0 #000); white-space: nowrap; }
.stat { display: flex; align-items: center; gap: 5px; background: #0c111b; border: 2px solid #3a4760;
  border-radius: 20px; padding: 3px 10px; font-weight: 800; white-space: nowrap; }
.stat .v { font-variant-numeric: tabular-nums; }
#coins .v { color: var(--gold); font-size: 16px; }
#income .v { color: var(--green); }
#trophies .v { color: #ffd98a; }
.spacer { flex: 1; }
.iconbtn { background: #2a3550; color: #fff; border: 2px solid #4a5a7c; border-radius: 10px; padding: 4px 8px;
  cursor: pointer; font-size: 15px; font-weight: 700; }
.iconbtn:hover { background: #34426a; }

/* ---------- goal bar ---------- */
@media (max-width: 720px) { .logo { display: none; } #tabs button { min-width: 64px; font-size: 12px; } }
#goal { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-weight: 700; font-size: 13px;
  background: repeating-linear-gradient(-45deg, #2c2410 0 14px, #231d0d 14px 28px); border-bottom: 2px solid #0a0e17; }
#goal .g-label { color: var(--gold); white-space: nowrap; }
#goal .g-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .g-prog { color: var(--dim); white-space: nowrap; }
#goal .g-rew { color: var(--green); white-space: nowrap; }

/* ---------- tabs ---------- */
#tabs { display: flex; gap: 4px; padding: 6px 8px 0; background: var(--bg2); overflow-x: auto; }
#tabs button { flex: 1; min-width: 80px; padding: 8px 6px 7px; border: 2px solid var(--line); border-bottom: none;
  border-radius: 12px 12px 0 0; background: #1b2232; color: var(--dim); font-weight: 800; font-size: 13px;
  cursor: pointer; white-space: nowrap; position: relative; }
#tabs button.active { background: var(--panel); color: #fff; box-shadow: inset 0 3px 0 var(--gold); }
#tabs button.pulse::after { content: "!"; position: absolute; top: 2px; right: 6px; background: var(--red); color: #fff;
  border-radius: 10px; width: 16px; height: 16px; font-size: 11px; line-height: 16px; animation: bob .8s infinite alternate; }
@keyframes bob { to { transform: translateY(-3px); } }
#main { flex: 1; overflow: auto; background: var(--panel); padding: 10px 16px; position: relative; }
.screen { display: none; }
.screen.show { display: block; }

/* ---------- common widgets ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px;
  border-radius: 10px; border: 2px solid #0a0e17; border-bottom-width: 5px; cursor: pointer; font-weight: 800;
  font-size: 14px; color: #fff; background: linear-gradient(#4a5d85, #34435f); text-shadow: 0 1px 0 #0008;
  transition: transform .05s; white-space: nowrap; }
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(2px); border-bottom-width: 3px; }
.btn.gold { background: linear-gradient(#ffd84d, #ff9d1c); color: #2a1a00; text-shadow: 0 1px 0 #fff6; }
.btn.green { background: linear-gradient(#5dff9a, #1fb85a); color: #03250f; text-shadow: 0 1px 0 #fff6; }
.btn.red { background: linear-gradient(#ff6b7a, #d02a3c); }
.btn.blue { background: linear-gradient(#6fd0ff, #2b86d6); }
.btn.purple { background: linear-gradient(#c79bff, #7a3fe0); }
.btn.big { font-size: 18px; padding: 12px 22px; }
.btn.small { font-size: 12px; padding: 4px 9px; border-bottom-width: 3px; border-radius: 8px; }
.btn.cant, .btn:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
.btn .cost { background: #0005; border-radius: 6px; padding: 1px 6px; color: #fff; }
.btn.gold .cost, .btn.green .cost { color: #fff; }
.card { background: linear-gradient(#2c3650, #222a3e); border: 2px solid var(--line); border-radius: 14px; padding: 10px;
  box-shadow: 0 3px 0 #0a0e17; }
.card h3 { margin: 0 0 6px; font-size: 15px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.hint { color: var(--dim); font-size: 12px; margin-top: 4px; }
.bar { height: 8px; background: #0b0f18; border-radius: 6px; overflow: hidden; border: 1px solid #000; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4db8ff, #7df0ff); }
.bar.xp > i { background: linear-gradient(90deg, #b57bff, #ff7bf0); }
.bar.hp > i { background: linear-gradient(90deg, #3ddc6b, #b6ff5c); }
.section-title { font-weight: 900; font-style: italic; letter-spacing: .5px; font-size: 18px; margin: 4px 0 10px;
  color: var(--gold); text-shadow: 0 2px 0 #000; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #0b0f18; font-weight: 800; font-size: 12px; }
.pill.ok { color: var(--green); } .pill.bad { color: var(--red); } .pill.gold { color: var(--gold); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 13px; }
.stats span { background: #0b0f18; border-radius: 8px; padding: 2px 7px; }
input[type=text] { background: #0b0f18; border: 2px solid var(--line); border-radius: 8px; color: #fff;
  padding: 7px 10px; font-size: 15px; font-weight: 700; outline: none; }
input[type=text]:focus { border-color: var(--gold); }

/* ---------- factory ---------- */
#factoryWrap { position: relative; }
#factoryCanvas { width: 100%; height: 320px; display: block; border-radius: 14px; border: 3px solid #0a0e17; background: #1a2030; cursor: pointer; }
#crankBtn { position: absolute; left: 12px; bottom: 12px; }
.shop { margin-top: 10px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.shop .card p { margin: 2px 0 8px; font-size: 12px; color: var(--dim); min-height: 30px; }

/* ---------- workshop ---------- */
.ws { display: grid; grid-template-columns: minmax(230px, 300px) 1fr; gap: 12px; }
@media (max-width: 720px) { .ws { grid-template-columns: 1fr; } }
#wsPreview { width: 100%; height: 230px; display: block; background: radial-gradient(#34405c, #161c2a); border-radius: 12px; border: 2px solid #0a0e17; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #0a0e17; cursor: pointer; }
.swatch.on { outline: 3px solid #fff; }
.slotrow { margin-bottom: 10px; }
.slotrow .lbl { font-weight: 900; margin-bottom: 4px; }
.parts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.part { flex: 0 0 104px; background: #1a2132; border: 2px solid var(--line); border-radius: 12px; padding: 5px; cursor: pointer;
  text-align: center; position: relative; }
.part:hover { border-color: #6a7ca3; }
.part.on { border-color: var(--gold); background: #33300f; box-shadow: 0 0 0 2px #ffcc3366; }
.part.locked { opacity: .45; cursor: not-allowed; }
.part canvas { width: 90px; height: 64px; display: block; margin: 0 auto; }
.part .pn { font-weight: 800; font-size: 11.5px; line-height: 1.15; min-height: 26px; }
.part .pc { color: var(--gold); font-weight: 800; font-size: 12px; }
.part .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px;
  font-weight: 800; padding: 6px; background: #0009; border-radius: 10px; color: #fff; }

/* ---------- army ---------- */
.bot { display: flex; gap: 10px; }
.bot canvas { width: 86px; height: 96px; flex: 0 0 86px; background: radial-gradient(#34405c, #161c2a); border-radius: 10px; }
.bot .info { flex: 1; min-width: 0; }
.bot .nm { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bot.broken canvas { filter: grayscale(1) brightness(.6); }
.bot .acts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
label.chk { display: inline-flex; gap: 5px; align-items: center; font-weight: 800; cursor: pointer; font-size: 12px; }

/* ---------- campaign ---------- */
.bases { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.base.locked { opacity: .5; }
.base.beaten { border-color: #2e7d4a; }
.base.next { border-color: var(--gold); box-shadow: 0 0 0 2px #ffcc3355, 0 3px 0 #0a0e17; }
.base .flag { font-size: 26px; float: right; }

/* ---------- research ---------- */
.res.maxed { border-color: #2e7d4a; }
.res .ico { font-size: 26px; float: right; }

/* ---------- battle overlay ---------- */
#battle { position: absolute; inset: 0; background: #0b0f18; display: none; flex-direction: column; z-index: 20; }
#battle.show { display: flex; }
#bTop { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: #151b29; flex-wrap: wrap; }
#bTeams { flex: 1; display: flex; gap: 8px; min-width: 0; }
.tbar { flex: 1; min-width: 60px; }
.tbar .tn { font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbar .bar { height: 10px; }
#bTime { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
#bCanvasWrap { flex: 1; position: relative; min-height: 0; }
#bCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bBottom { display: flex; gap: 8px; justify-content: center; padding: 6px; background: #151b29; flex-wrap: wrap; }
.pu { position: relative; min-width: 96px; }
.pu .n { position: absolute; top: -8px; right: -8px; background: var(--red); border: 2px solid #0a0e17; border-radius: 12px;
  font-size: 12px; min-width: 22px; height: 22px; line-height: 18px; }
.pu.armed { outline: 3px solid #fff; animation: bob .5s infinite alternate; }
#bMsg { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-weight: 900; font-size: 16px;
  background: #000a; padding: 6px 14px; border-radius: 12px; pointer-events: none; display: none; white-space: nowrap; }
#emotes { position: absolute; right: 8px; top: 8px; display: none; gap: 4px; }
#emotes button { font-size: 18px; background: #0008; border: 2px solid #fff3; border-radius: 10px; cursor: pointer; padding: 2px 6px; }

/* ---------- modal + toast ---------- */
#modal { position: absolute; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
#modal.show { display: flex; }
#modalBox { background: linear-gradient(#2c3650, #1c2335); border: 3px solid var(--gold); border-radius: 18px; padding: 16px;
  max-width: 520px; width: 100%; max-height: 100%; overflow: auto; box-shadow: 0 10px 40px #000; }
#modalBox h2 { margin: 0 0 10px; font-style: italic; font-weight: 900; }
#modalBox textarea { width: 100%; height: 90px; background: #0b0f18; color: #b9ffcf; border: 2px solid var(--line); border-radius: 8px;
  font-family: monospace; font-size: 11px; padding: 6px; resize: none; user-select: text; -webkit-user-select: text; }
.mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
#toasts { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); width: max-content; max-width: 92%; display: flex; flex-direction: column;
  gap: 6px; align-items: center; z-index: 60; pointer-events: none; }
.toast { background: #0d1320ee; border: 2px solid var(--gold); color: #fff; font-weight: 800; padding: 7px 14px; border-radius: 12px;
  animation: toastIn .25s ease-out; box-shadow: 0 4px 12px #000a; text-align: center; }
@keyframes toastIn { from { transform: translateY(-16px); opacity: 0; } }

/* ---------- title ---------- */
#title { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; background: radial-gradient(ellipse at 50% 30%, #2b3a5e, #0b0f18 70%); padding: 12px; overflow: auto; }
#title canvas { width: min(560px, 96%); height: 170px; }
.bigLogo { font-size: clamp(28px, 7vw, 56px); font-weight: 900; font-style: italic; text-align: center; line-height: .95;
  background: linear-gradient(#fff6c2, #ffcc33 45%, #ff7a1c); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #000) drop-shadow(0 0 20px #ff9d1c55); transform: skew(-6deg); letter-spacing: 1px; }
.bigLogo small { display: block; font-size: .45em; letter-spacing: 6px; }
#title .row { justify-content: center; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="logo">🤖 ROBOT ARMY TYCOON</span>
    <span class="stat" id="coins" title="Coins">💰 <span class="v">0</span></span>
    <span class="stat" id="income" title="Coins per second">📈 <span class="v">0</span>/s</span>
    <span class="stat" id="trophies" title="Trophies from Arena and Online battles">🏆 <span class="v">0</span></span>
    <span class="spacer"></span>
    <button class="iconbtn" data-act="sound" id="soundBtn" title="Sound on/off">🔊</button>
    <button class="iconbtn" data-act="savemenu" title="Save code / load code">💾 Save</button>
  </div>
  <div id="goal"><span class="g-label">🎯 GOAL:</span><span class="g-text"></span><span class="g-prog"></span><span class="g-rew"></span></div>
  <div id="tabs">
    <button data-tab="factory" class="active">🏭 Factory</button>
    <button data-tab="workshop">🔧 Workshop</button>
    <button data-tab="army">🤖 Army</button>
    <button data-tab="battle">⚔️ Battle</button>
    <button data-tab="research">🔬 Research</button>
    <button data-tab="online">🌐 Online</button>
  </div>
  <div id="main">
    <div class="screen show" id="s-factory">
      <div id="factoryWrap">
        <canvas id="factoryCanvas"></canvas>
        <button class="btn gold big" id="crankBtn" data-act="crank">⚙️ CRANK! <span class="cost" id="crankVal">+1</span></button>
      </div>
      <div class="shop" id="shop"></div>
    </div>
    <div class="screen" id="s-workshop"></div>
    <div class="screen" id="s-army"></div>
    <div class="screen" id="s-battle"></div>
    <div class="screen" id="s-research"></div>
    <div class="screen" id="s-online"></div>
  </div>

  <div id="battle">
    <div id="bTop">
      <div id="bTeams"></div>
      <span id="bTime">0:00</span>
      <button class="btn small" data-act="bspeed" id="bSpeed">⏩ 1x</button>
      <button class="btn small red" data-act="bquit" id="bQuit">🏳️ Retreat</button>
    </div>
    <div id="bCanvasWrap"><canvas id="bCanvas"></canvas><div id="bMsg"></div>
      <div id="emotes"><button data-emo="😂">😂</button><button data-emo="😎">😎</button><button data-emo="😡">😡</button><button data-emo="🔥">🔥</button><button data-emo="👋">👋</button></div>
    </div>
    <div id="bBottom"></div>
  </div>

  <div id="title">
    <div class="bigLogo">ROBOT ARMY<small>TYCOON</small></div>
    <canvas id="titleCanvas"></canvas>
    <div class="row">
      <button class="btn gold big" data-act="play" id="playBtn">▶ PLAY</button>
      <button class="btn big" data-act="loadmenu">📂 Load save code</button>
    </div>
    <div class="hint" id="saveWarn" style="text-align:center;color:#ffcc33;display:none">⚠️ This page can't save by itself here. Before you stop playing, press <b>💾 Save</b> and copy your save code!</div>
    <div class="hint" style="text-align:center">Build a factory 🏭 → make money 💰 → build robots 🤖 → win battles ⚔️<br>Play against bots or online with up to 4 friends 🌐</div>
  </div>
  <div id="modal"><div id="modalBox"></div></div>
  <div id="toasts"></div>
</div>
<script>
'use strict';
// ============================================================
//  HELPERS
// ============================================================
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)).replace(/\.0+$/, '') + u[i];
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// seeded random (so every computer can make the same battlefield)
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// saving can be blocked inside Google Sites, so every use is wrapped in try/catch
const Store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { window.localStorage.removeItem(k); } catch (e) { /* */ } },
};

// running inside a claude.ai artifact? (then online play is blocked, but cloud saving works)
const IN_ARTIFACT = !!(window.claude && typeof window.claude.use === 'function');
const Cloud = { ref: null, loaded: null, lastBody: '', lastWrite: 0, pending: false, busy: false, hold: false, started: false };

// ============================================================
//  SOUNDS (made with math, no sound files — same idea as LAB 13)
// ============================================================
const Sfx = (function () {
  let ctx = null, master = null, noiseBuf = null, muted = false, musicGain = null, musicTimer = null, lastPlay = {};
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 5; comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(comp);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.35; musicGain.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const now = () => ctx.currentTime;
  function env(g, t0, attack, dur, vol) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function tone(type, f0, f1, dur, vol, delay = 0, dest) {
    if (!ctx) return;
    const t0 = now() + delay;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    const g = ctx.createGain(); env(g, t0, 0.005, dur, vol);
    o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(dur, type, f0, f1, vol, delay = 0, q = 1, dest) {
    if (!ctx) return;
    const t0 = now() + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    const g = ctx.createGain(); env(g, t0, 0.004, dur, vol);
    s.connect(f); f.connect(g); g.connect(dest || master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }
  // don't play the same sound 20 times in one frame
  function ok(name, gap) {
    if (!ctx || muted) return false;
    const t = performance.now();
    if (lastPlay[name] && t - lastPlay[name] < gap) return false;
    lastPlay[name] = t; return true;
  }
  const S = {
    click() { if (ok('click', 30)) tone('square', 900, 600, 0.05, 0.12); },

  // simple battle music: a bass line and a beat
  function startMusic(fast) {
    stopMusic();
    if (!ctx) return;
    const bass = [55, 55, 65.4, 55, 73.4, 55, 65.4, 49];
    let step = 0;
    const beat = fast ? 0.16 : 0.2;
    musicTimer = setInterval(() => {
      if (muted || !ctx) return;
      const n = bass[(step >> 1) % bass.length];
      if (step % 2 === 0) tone('sawtooth', n, n, beat * 1.6, 0.14, 0, musicGain);
      if (step % 4 === 0) { tone('sine', 150, 40, 0.15, 0.5, 0, musicGain); }
      if (step % 4 === 2) noise(0.08, 'highpass', 3000, 3000, 0.12, 0, 1, musicGain);
      if (step % 8 === 6 && Math.random() < 0.5) tone('square', n * 4, n * 4, 0.1, 0.03, 0, musicGain);
      step++;
    }, beat * 1000);
  }
  function stopMusic() { if (musicTimer) clearInterval(musicTimer); musicTimer = null; }
  return {
    init, S, startMusic, stopMusic,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.5; },
    get muted() { return muted; },
  };

// fun robot names
const NAME_A = ['Rusty', 'Sparky', 'Bolt', 'Turbo', 'Mega', 'Tiny', 'Big', 'Captain', 'Sir', 'Doctor', 'Iron', 'Laser', 'Crusher', 'Zappy', 'Robo', 'Clanky', 'Gizmo', 'Nitro', 'Titan', 'Beep'];
const NAME_B = ['Boop', 'Smash', 'Bot', 'Tron', 'Max', 'Gears', '3000', 'X', 'Punch', 'Byte', 'Nugget', 'Wrench', 'Blaster', 'Zilla', 'Chomp', 'Dozer', 'Beans', 'McBolt', 'Jr.', 'Prime'];
const randomName = () => pick(NAME_A) + ' ' + pick(NAME_B);
// arena ranks (from trophies)
const RANKS = [[0, '🔩 Rookie'], [50, '🥉 Bronze'], [150, '🥈 Silver'], [300, '🥇 Gold'], [600, '💎 Diamond'], [1000, '👑 Legend']];
const rankOf = (tr) => RANKS.filter((r) => tr >= r[0]).pop()[1];

// ============================================================
//  DRAWING ROBOTS  (every part is drawn with code)
//  Robots are drawn facing right, feet at (0,0), about 110 tall.
// ============================================================
const INK = '#141821';
function shade(hex, amt) { // amt -1..1 : darker..lighter
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map((x) => x + x).join('');
  const n = parseInt(c, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}
function metal(c, col, y0, y1) { // shiny metal gradient, light at the top
  const g = c.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, shade(col, 0.55)); g.addColorStop(0.35, shade(col, 0.1)); g.addColorStop(1, shade(col, -0.45));
  return g;
}
function rr(c, x, y, w, h, r) { // rounded rectangle path
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function fillStroke(c, fill, lw = 3) { c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = INK; c.stroke(); }
function circle(c, x, y, r, fill, lw = 3) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); fillStroke(c, fill, lw); }
function shine(c, x, y, w, h) { c.fillStyle = 'rgba(255,255,255,.35)'; rr(c, x, y, w, h, h / 2); c.fill(); }
function rivet(c, x, y) { c.fillStyle = '#dfe6f2'; c.beginPath(); c.arc(x, y, 1.8, 0, 7); c.fill(); }
const STEEL = '#8c96a8', DARK = '#3b4152';

// ---------- LEGS: return the hip height ----------
function drawLegs(c, id, col, p) {
  const w = p.walk || 0, t = p.t || 0;
  if (id === 'l_wheels') {
    rr(c, -22, -30, 44, 12, 5); fillStroke(c, metal(c, DARK, -30, -18));
    for (const x of [-13, 13]) {
      circle(c, x, -11, 11, '#22252d');
      circle(c, x, -11, 5, metal(c, STEEL, -16, -6), 2);
      c.save(); c.translate(x, -11); c.rotate(w * 2); c.strokeStyle = '#aab3c4'; c.lineWidth = 2;
      for (let i = 0; i < 3; i++) { c.rotate(Math.PI * 2 / 3); c.beginPath(); c.moveTo(5, 0); c.lineTo(10, 0); c.stroke(); }
      c.restore();
    }
    return -26;
  }
  if (id === 'l_walker' || id === 'l_stomper') {
    const big = id === 'l_stomper', hip = big ? -44 : -32, th = big ? 13 : 7, seg = big ? 22 : 16;
    for (let i = 0; i < 2; i++) {
      const sw = Math.sin(w + i * Math.PI) * (p.moving ? 0.5 : 0.08);
      const hx = (i ? 5 : -5), kx = hx + Math.sin(sw) * seg, ky = hip + Math.cos(sw) * seg;
      const lift = Math.max(0, -Math.sin(w + i * Math.PI)) * (p.moving ? 5 : 0);
      const fx = kx + Math.sin(sw * 0.3) * 4, fy = -lift - (big ? 6 : 4);
      const legCol = i ? col : shade(col, -0.35);
      c.lineCap = 'round';
      c.strokeStyle = INK; c.lineWidth = th + 4; c.beginPath(); c.moveTo(hx, hip); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
      c.strokeStyle = i ? shade(STEEL, 0.1) : shade(STEEL, -0.3); c.lineWidth = th; c.beginPath(); c.moveTo(hx, hip); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
      circle(c, kx, ky, big ? 8 : 5, legCol, 2);
      rr(c, fx - (big ? 16 : 9), fy - (big ? 6 : 3), big ? 34 : 20, big ? 12 : 7, 3); fillStroke(c, metal(c, i ? DARK : '#2a2e39', fy - 6, fy + 6), 2);
    }
    return hip + 2;
  }
  if (id === 'l_treads') {
    rr(c, -28, -26, 56, 26, 12); fillStroke(c, '#23262e');
    c.save(); rr(c, -28, -26, 56, 26, 12); c.clip();
    c.strokeStyle = '#4a4f5c'; c.lineWidth = 3;
    const off = ((w * 6) % 8 + 8) % 8;
    for (let x = -32 + off; x < 32; x += 8) { c.beginPath(); c.moveTo(x, -26); c.lineTo(x, -22); c.moveTo(x, -4); c.lineTo(x, 0); c.stroke(); }
    c.restore();
    for (const x of [-16, 0, 16]) circle(c, x, -13, 6, metal(c, STEEL, -19, -7), 2);
    rr(c, -24, -32, 48, 9, 4); fillStroke(c, metal(c, col, -32, -23), 2);
    return -30;
  }
  if (id === 'l_spider') {
    for (let i = 0; i < 4; i++) {
      const side = i % 2 ? 1 : -1, back = i < 2;
      const ph = w * 1.4 + i * 1.7, lift = p.moving ? Math.max(0, Math.sin(ph)) * 6 : 0;
      const hx = side * 6, hy = -26, kx = side * (18 + (back ? 0 : 6)), ky = -40 - lift * 0.5, fx = side * (26 + (back ? -2 : 8)), fy = -lift;
      c.lineCap = 'round';
      c.strokeStyle = INK; c.lineWidth = 8; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
      c.strokeStyle = back ? '#555c6c' : '#8c96a8'; c.lineWidth = 4; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
      circle(c, kx, ky, 3.5, back ? shade(col, -0.4) : col, 2);
    }
    circle(c, 0, -26, 10, metal(c, DARK, -36, -16));
    return -30;
  }
  if (id === 'l_jet') {
    const bob = Math.sin(t * 5) * 3;
    // flames
    const fl = 12 + Math.sin(t * 40) * 4;
    c.fillStyle = '#ff8a1f'; c.beginPath(); c.moveTo(-10, -12 + bob); c.lineTo(0, -12 + bob + fl + 8); c.lineTo(10, -12 + bob); c.fill();
    c.fillStyle = '#ffe066'; c.beginPath(); c.moveTo(-5, -12 + bob); c.lineTo(0, -12 + bob + fl); c.lineTo(5, -12 + bob); c.fill();
    c.beginPath(); c.ellipse(0, -20 + bob, 22, 11, 0, 0, Math.PI * 2); fillStroke(c, metal(c, col, -31 + bob, -9 + bob));
    rr(c, -12, -15 + bob, 24, 6, 3); fillStroke(c, '#2a2e39', 2);
    shine(c, -14, -28 + bob, 16, 4);
    return -28 + bob;
  }
  return -26;
}

// ---------- BODIES: return {neck, shoulder} heights ----------
function drawBody(c, id, col, hip, p) {
  const t = p.t || 0;
  if (id === 'b_can') {
    rr(c, -19, hip - 44, 38, 46, 10); fillStroke(c, metal(c, col, hip - 44, hip));
    c.strokeStyle = shade(col, -0.5); c.lineWidth = 2;
    for (const y of [12, 24]) { c.beginPath(); c.moveTo(-17, hip - 44 + y); c.lineTo(17, hip - 44 + y); c.stroke(); }
    shine(c, -13, hip - 40, 8, 4);
    return { neck: hip - 42, sh: hip - 34 };
  }
  if (id === 'b_box') {
    rr(c, -22, hip - 44, 44, 46, 4); fillStroke(c, metal(c, col, hip - 44, hip));
    c.strokeStyle = shade(col, -0.5); c.lineWidth = 2; rr(c, -14, hip - 34, 28, 22, 3); c.stroke();
    for (const [x, y] of [[-18, 5], [18, 5], [-18, 40], [18, 40]]) rivet(c, x, hip - 44 + y);
    shine(c, -16, hip - 41, 12, 4);
    return { neck: hip - 42, sh: hip - 34 };
  }
  if (id === 'b_round') {
    circle(c, 0, hip - 24, 26, metal(c, col, hip - 50, hip + 2));
    const pulse = 0.5 + Math.sin(t * 4) * 0.5;
    circle(c, 6, hip - 22, 7, `rgba(77,255,136,${0.5 + pulse * 0.5})`, 2);
    shine(c, -14, hip - 42, 12, 5);
    return { neck: hip - 46, sh: hip - 34 };
  }
  if (id === 'b_armor') {
    c.beginPath(); c.moveTo(-28, hip - 50); c.lineTo(28, hip - 50); c.lineTo(22, hip + 2); c.lineTo(-22, hip + 2); c.closePath();
    fillStroke(c, metal(c, col, hip - 50, hip));
    c.strokeStyle = shade(col, -0.55); c.lineWidth = 2;
    for (const y of [16, 30]) { c.beginPath(); c.moveTo(-25, hip - 50 + y); c.lineTo(25, hip - 50 + y); c.stroke(); }
    rr(c, -8, hip - 44, 16, 10, 3); fillStroke(c, metal(c, STEEL, hip - 44, hip - 34), 2);
    shine(c, -22, hip - 47, 16, 4);
    return { neck: hip - 48, sh: hip - 40 };
  }
  if (id === 'b_reactor') {
    rr(c, -22, hip - 48, 44, 50, 10); fillStroke(c, metal(c, col, hip - 48, hip));
    const pulse = 0.6 + Math.sin(t * 6) * 0.4;
    c.save(); c.shadowColor = '#4dc8ff'; c.shadowBlur = 14 * pulse;
    circle(c, 0, hip - 24, 11, `rgba(120,230,255,${0.6 + pulse * 0.4})`, 3);
    c.restore();
    circle(c, 0, hip - 24, 5, '#e8fbff', 0.01);
    shine(c, -16, hip - 45, 12, 4);
    return { neck: hip - 46, sh: hip - 38 };
  }
  if (id === 'b_shield') {
    c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-12, hip - 46); c.lineTo(-18, hip - 66); c.stroke();
    c.save(); c.translate(-18, hip - 68); c.rotate(-0.5); c.beginPath(); c.ellipse(0, 0, 9, 4, 0, 0, Math.PI * 2); fillStroke(c, '#d8e0ee', 2); c.restore();
    rr(c, -24, hip - 50, 48, 52, 14); fillStroke(c, metal(c, col, hip - 50, hip));
    c.strokeStyle = 'rgba(120,230,255,.8)'; c.lineWidth = 2;
    c.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; c.lineTo(Math.cos(a) * 10, hip - 24 + Math.sin(a) * 10); } c.closePath(); c.stroke();
    shine(c, -17, hip - 46, 14, 4);
    return { neck: hip - 48, sh: hip - 40 };
  }
  if (id === 'b_titan') {
    rr(c, -30, hip - 62, 60, 64, 10); fillStroke(c, metal(c, col, hip - 62, hip));
    c.save(); rr(c, -30, hip - 22, 60, 12, 2); c.clip();
    for (let x = -40; x < 40; x += 12) { c.fillStyle = '#ffcc33'; c.beginPath(); c.moveTo(x, hip - 10); c.lineTo(x + 6, hip - 10); c.lineTo(x + 18, hip - 22); c.lineTo(x + 12, hip - 22); c.fill(); }
    c.restore(); rr(c, -30, hip - 22, 60, 12, 2); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
    circle(c, 0, hip - 42, 9, metal(c, STEEL, hip - 51, hip - 33));
    for (const [x, y] of [[-24, 6], [24, 6], [-24, 34], [24, 34]]) rivet(c, x, hip - 62 + y);
    shine(c, -22, hip - 58, 18, 5);
    return { neck: hip - 60, sh: hip - 52 };
  }
  return { neck: hip - 40, sh: hip - 32 };
}

// ---------- HEADS ----------
function eyes(c, pts, r, look, glow) {
  for (const [x, y] of pts) {
    if (glow) { c.save(); c.shadowColor = glow; c.shadowBlur = 8; circle(c, x, y, r, glow, 2); c.restore(); continue; }
    circle(c, x, y, r, '#fff', 2);
    c.fillStyle = INK; c.beginPath(); c.arc(x + look * r * 0.35, y + 0.5, r * 0.5, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x + look * r * 0.35 + 1, y - 1, r * 0.18, 0, 7); c.fill();
  }
}
function drawHead(c, id, col, neck, p) {
  const t = p.t || 0, blink = (Math.sin(t * 1.3 + (p.seed || 0)) > 0.985);
  c.save(); c.translate(2, neck);
  if (p.hurt > 0.5) c.rotate(-0.15);
  if (id === 'h_bolt') {
    c.fillStyle = INK; c.fillRect(-2, -32, 4, 8);
    c.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; c.lineTo(Math.cos(a) * 5, -33 + Math.sin(a) * 4); } c.closePath(); fillStroke(c, metal(c, STEEL, -37, -29), 2);
    rr(c, -13, -26, 28, 26, 7); fillStroke(c, metal(c, col, -26, 0));
    if (blink) { c.fillStyle = INK; c.fillRect(0, -15, 14, 2); } else eyes(c, [[3, -14], [11, -14]], 4.5, 1);
    shine(c, -9, -23, 9, 3);
  } else if (id === 'h_visor') {
    rr(c, -14, -28, 30, 28, 12); fillStroke(c, metal(c, col, -28, 0));
    c.save(); c.shadowColor = '#ff4d5e'; c.shadowBlur = 10; rr(c, -2, -19, 20, 8, 4); fillStroke(c, '#ff4d5e', 2); c.restore();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(2 + ((t * 30) % 12), -17, 3, 4);
    shine(c, -9, -25, 10, 3);
  } else if (id === 'h_cyclops') {
    circle(c, 1, -15, 16, metal(c, col, -31, 1));
    if (blink) { c.fillStyle = INK; c.fillRect(0, -16, 16, 3); } else eyes(c, [[7, -16]], 8.5, 1);
    shine(c, -9, -26, 8, 3);
  } else if (id === 'h_dome') {
    rr(c, -16, -8, 34, 9, 4); fillStroke(c, metal(c, STEEL, -8, 1), 2);
    c.beginPath(); c.arc(1, -8, 17, Math.PI, 0); c.closePath();
    c.fillStyle = 'rgba(160,220,255,.35)'; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
    circle(c, 4, -15, 8, metal(c, col, -23, -7), 2);
    eyes(c, [[3, -16], [8, -16]], 2.3, 1);
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.beginPath(); c.arc(1, -8, 13, Math.PI * 1.15, Math.PI * 1.45); c.stroke();
  } else if (id === 'h_brain') {
    rr(c, -14, -6, 30, 7, 3); fillStroke(c, metal(c, STEEL, -6, 1), 2);
    rr(c, -12, -32, 26, 27, 6); c.fillStyle = 'rgba(160,230,255,.25)'; c.fill();
    c.fillStyle = '#ff8fc8'; for (const [x, y, r] of [[-3, -20, 7], [5, -22, 7], [1, -15, 7], [7, -14, 5]]) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
    c.strokeStyle = '#c0508a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(1, -28); c.quadraticCurveTo(-2, -20, 2, -12); c.stroke();
    rr(c, -12, -32, 26, 27, 6); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
    eyes(c, [[4, -2], [10, -2]], 2.5, 1, '#4dff88');
    shine(c, -9, -30, 4, 12);
  } else if (id === 'h_skull') {
    circle(c, 1, -18, 15, metal(c, '#d9dde6', -33, -3));
    rr(c, -8, -8, 20, 10, 3); fillStroke(c, metal(c, '#c7ccd6', -8, 2));
    c.strokeStyle = INK; c.lineWidth = 1.5; for (const x of [-3, 2, 7]) { c.beginPath(); c.moveTo(x, -6); c.lineTo(x, 1); c.stroke(); }
    c.fillStyle = INK; c.beginPath(); c.ellipse(-2, -18, 4.5, 5, 0, 0, 7); c.ellipse(9, -18, 4.5, 5, 0, 0, 7); c.fill();
    c.save(); c.shadowColor = '#ff2a2a'; c.shadowBlur = 10; c.fillStyle = '#ff3b3b';
    c.beginPath(); c.arc(-1, -18, 2, 0, 7); c.arc(10, -18, 2, 0, 7); c.fill(); c.restore();
  } else if (id === 'h_crown') {
    rr(c, -14, -26, 30, 26, 8); fillStroke(c, metal(c, col, -26, 0));
    c.beginPath(); c.moveTo(-13, -26); c.lineTo(-13, -40); c.lineTo(-6, -32); c.lineTo(1, -44); c.lineTo(8, -32); c.lineTo(15, -40); c.lineTo(15, -26); c.closePath();
    fillStroke(c, metal(c, '#ffcc33', -44, -26), 2);
    circle(c, 1, -35, 2.5, '#ff4d5e', 1);
    eyes(c, [[4, -14], [11, -14]], 4, 1);
    c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(0, -21); c.lineTo(7, -18); c.moveTo(15, -21); c.lineTo(9, -18); c.stroke();
  }
  if (p.stun > 0) { // dizzy stars
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * 2.1; const x = Math.cos(a) * 16, y = -36 + Math.sin(a) * 4;
      c.fillStyle = '#ffe066'; c.font = 'bold 10px sans-serif'; c.fillText('★', x - 4, y);
    }
  }
  c.restore();
}

// ---------- ARMS (weapons) ----------
function drawArm(c, id, col, sh, p, front) {
  const t = p.t || 0, a = p.atk || 0;
  const armCol = front ? STEEL : shade(STEEL, -0.35);
  const bodyCol = front ? col : shade(col, -0.35);
  c.save(); c.translate(front ? 4 : -4, sh);
  const upper = (x, y) => { c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = 9; c.beginPath(); c.moveTo(0, 0); c.lineTo(x, y); c.stroke(); c.strokeStyle = armCol; c.lineWidth = 5; c.beginPath(); c.moveTo(0, 0); c.lineTo(x, y); c.stroke(); circle(c, 0, 0, 5, bodyCol, 2); };
  if (id === 'a_punch') {
    const reach = front ? a * 16 : 0;
    upper(12 + reach, 12);
    circle(c, 16 + reach, 12, 9, metal(c, bodyCol, 3, 21));
    c.strokeStyle = INK; c.lineWidth = 1.5; for (const y of [8, 12, 16]) { c.beginPath(); c.moveTo(20 + reach, y); c.lineTo(24 + reach, y); c.stroke(); }
  } else if (id === 'a_blaster') {
    upper(10, 10);
    const rec = front ? -a * 4 : 0;
    rr(c, 4 + rec, 4, 26, 10, 3); fillStroke(c, metal(c, DARK, 4, 14));
    rr(c, 26 + rec, 6, 8, 6, 2); fillStroke(c, bodyCol, 2);
    if (front && a > 0.6) { c.fillStyle = '#ffe066'; c.beginPath(); c.arc(38, 9, 6 * a, 0, 7); c.fill(); }
  } else if (id === 'a_saw') {
    upper(16, 10);
    c.save(); c.translate(24, 10); c.rotate(t * (front ? 25 : 18));
    c.beginPath(); for (let i = 0; i < 16; i++) { const r = i % 2 ? 10 : 14; const an = i / 16 * Math.PI * 2; c.lineTo(Math.cos(an) * r, Math.sin(an) * r); } c.closePath();
    fillStroke(c, metal(c, '#dfe6f2', -14, 14), 2);
    circle(c, 0, 0, 4, bodyCol, 2);
    c.restore();
  } else if (id === 'a_rocket') {
    upper(10, 12);
    if (front) {
      c.save(); c.translate(-10, -12);
      rr(c, 0, -10, 30, 16, 4); fillStroke(c, metal(c, bodyCol, -10, 6));
      for (const y of [-6, 1]) { c.fillStyle = a > 0.5 && y < 0 ? '#333' : '#ff4d5e'; c.beginPath(); c.moveTo(30, y - 2.5); c.lineTo(37, y); c.lineTo(30, y + 2.5); c.fill(); }
      c.fillStyle = '#ffcc33'; c.fillRect(4, -7, 6, 10);
      c.restore();
    } else { circle(c, 12, 12, 6, metal(c, bodyCol, 6, 18), 2); }
  } else if (id === 'a_hammer') {
    if (!front) { upper(8, 12); circle(c, 10, 14, 5, bodyCol, 2); c.restore(); return; }
    const ang = lerp(-1.9, 0.5, a > 0 ? Math.sin(a * Math.PI * 0.5) : 0);
    upper(8, 8);
    c.save(); c.translate(8, 8); c.rotate(ang);
    c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(0, 0); c.lineTo(34, 0); c.stroke();
    c.strokeStyle = '#a0703c'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(34, 0); c.stroke();
    rr(c, 28, -12, 16, 24, 3); fillStroke(c, metal(c, DARK, -12, 12));

function botArmy(power, maxBots = 6, rng = Math.random) {
  const avail = Object.values(PARTS).filter((p) => p.unlock === 'start' || (p.unlock.startsWith('b:') && +p.unlock.slice(2) <= Math.max(1, G.beaten)) || (p.unlock.startsWith('r:') && RES[p.unlock.slice(2)].need <= Math.max(1, G.beaten)));

  for (let i = 0; i < count; i++) {
    let best = null;
    for (let tries = 0; tries < 30; tries++) {
      const d = { head: pickR(bySlot('head'), rng).id, body: pickR(bySlot('body'), rng).id, arms: pickR(bySlot('arms'), rng).id, legs: pickR(bySlot('legs'), rng).id };
      for (let lvl = 1; lvl <= MAX_LVL; lvl++) {
        const pw = robotStats(d, bonusNow(), lvl).power;
        const score = Math.abs(pw - per);
        if (!best || score < best.score) best = { d, lvl, score };
        if (pw > per) break;

    }
    list.push(best);
  }
  return list;
}

    else if (p.type === 'ring' || p.type === 'target') { c.strokeStyle = p.col; c.lineWidth = 3; c.beginPath(); c.ellipse(p.x, p.y, p.s * (p.type === 'ring' ? 1.2 - k : 1), p.s * 0.4 * (p.type === 'ring' ? 1.2 - k : 1), 0, 0, 7); c.stroke(); }
    else if (p.type === 'plus') { c.fillStyle = p.col; c.font = 'bold ' + p.s * 1.4 + 'px sans-serif'; c.textAlign = 'center'; c.fillText('+', p.x, p.y); }
    else if (p.type === 'debris') { c.fillStyle = p.col; c.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  }
  c.globalAlpha = 1;
  // floating numbers
  c.textAlign = 'center';
  for (let i = BV.texts.length - 1; i >= 0; i--) {
    const T = BV.texts[i]; T.life -= dt; T.y -= 35 * dt; if (T.life <= 0) { BV.texts.splice(i, 1); continue; }
    c.globalAlpha = clamp(T.life * 2, 0, 1); c.font = 'bold ' + T.size + 'px sans-serif';
    c.lineWidth = 3; c.strokeStyle = '#000'; c.strokeText(T.txt, T.x, T.y); c.fillStyle = T.col; c.fillText(T.txt, T.x, T.y);
  }
  c.globalAlpha = 1;
  // aiming circle for EMP / airstrike
  if (BV.armed && BV.mouse) {
    const R = BV.armed === 'emp' ? 130 : 110;
    c.strokeStyle = BV.armed === 'emp' ? '#7df0ff' : '#ff4d5e'; c.lineWidth = 3; c.setLineDash([8, 6]);
    c.beginPath(); c.ellipse(BV.mouse.x, BV.mouse.y, R, R * 0.4, 0, 0, 7); c.stroke(); c.setLineDash([]);
  }
  // banner
  const msg = $('bMsg');
  if (BV.banner) { BV.banner.t -= dt; msg.style.display = BV.banner.t > 0 ? 'block' : 'none'; msg.textContent = BV.banner.txt; if (BV.banner.t <= 0) BV.banner = null; }
  else if (BV.armed) { msg.style.display = 'block'; msg.textContent = '👆 Click the battlefield to use ' + POWERS[BV.armed].name; }
  else msg.style.display = 'none';
}

function battleHud() {
  const V = BV.view; if (!V) return;
  const bars = [];
  if (V.mode === 'campaign') {
    bars.push({ n: '🔵 Your army', v: teamHp(V, 0), col: '#4dff88' });
    bars.push({ n: BASES[V.baseIdx].flag + ' ' + BASES[V.baseIdx].name + ' base', v: V.base.hp / V.base.maxHp, col: '#ff4d5e' });
  } else V.teams.forEach((tm, i) => bars.push({ n: (i === BV.myTeam ? '⭐ ' : '') + tm.name, v: teamHp(V, i), col: TEAM_COLORS[i] }));
  $('bTeams').innerHTML = bars.map((b) => `<div class="tbar"><div class="tn">${esc(b.n)}</div><div class="bar"><i style="width:${(clamp(b.v, 0, 1) * 100).toFixed(1)}%;background:${b.col}"></i></div></div>`).join('');
  const left = Math.max(0, Math.ceil(V.limit - V.time));
  $('bTime').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  const tm = V.teams[BV.myTeam];
  if (tm) for (const k in POWERS) { const el = document.querySelector(`.pu[data-pu="${k}"] .n`); if (el) { el.textContent = tm.charges[k] || 0; el.parentElement.classList.toggle('cant', !tm.charges[k]); } }
}
function teamHp(V, team) {
  let h = 0, m = 0;
  for (const u of V.units) if (u.team === team) { h += Math.max(0, u.hp); m += u.maxHp; }
  return m ? h / m : 0;
}

function openBattle(view, opts = {}) {
  BV.view = view; BV.local = opts.local ? view : null; BV.online = !!opts.online; BV.myTeam = opts.myTeam || 0;
  BV.anim.clear(); BV.parts = []; BV.texts = []; BV.beams = []; BV.shake = 0; BV.armed = null; BV.acc = 0; BV.banner = null;
  BV.speed = 1; BV.ctx = opts.ctx || null; BV.sendPower = opts.sendPower || null; BV.onEnd = opts.onEnd || null; BV.ended = false;
  BV.bg = makeBattleBg(view.seed || 1, view.mode, view.baseIdx);

  $('bSpeed').style.display = BV.online ? 'none' : '';

    `<button class="btn pu ${k === 'emp' ? 'blue' : k === 'air' ? 'red' : k === 'repair' ? 'green' : 'purple'}" data-pu="${k}" title="${POWERS[k].desc} (key ${['repair', 'shield', 'emp', 'air'].indexOf(k) + 1})">${POWERS[k].ico} ${POWERS[k].name}<span class="n">0</span></button>`).join('');
  $('battle').classList.add('show');
  if (!BV.online && G.stats.wins + G.stats.losses < 3) BV.banner = { txt: '💡 Tip: use the POWER-UPS at the bottom!', t: 4 };
  Sfx.startMusic(view.mode === 'campaign' && view.baseIdx === 9);

}
function closeBattle() {
  BV.view = null; BV.local = null; BV.armed = null;

  Sfx.stopMusic();
}
function battleTick(dt) {
  if (!BV.view) return;
  if (BV.local) {
    BV.acc += Math.min(dt, 0.1) * BV.speed;
    const STEP = 1 / 30;
    while (BV.acc >= STEP) { BV.acc -= STEP; stepBattle(BV.local, STEP); if (BV.hostTick) BV.hostTick(STEP); }
    const evs = BV.local.events.splice(0);
    if (BV.hostEvents) BV.hostEvents(evs);
    handleEvents(evs);
    if (BV.local.over && !BV.ended) { BV.ended = true; setTimeout(() => { if (BV.onEnd) BV.onEnd(BV.local); }, 1400); }
  }
  drawBattle(dt);
  BV.hudT -= dt; if (BV.hudT <= 0) { BV.hudT = 0.15; battleHud(); }
}
function battleClick(ev) {
  if (!BV.view || !BV.armed || !BV.xf) return;
  const rect = $('bCanvas').getBoundingClientRect();
  const x = (ev.clientX - rect.left - BV.xf.ox) / BV.xf.s, y = (ev.clientY - rect.top - BV.xf.oy) / BV.xf.s;
  firePower(BV.armed, clamp(x, 0, FIELD.w), clamp(y, FIELD.top, FIELD.bottom));
  BV.armed = null; document.querySelectorAll('.pu').forEach((b) => b.classList.remove('armed'));
}
function battleMove(ev) {
  if (!BV.xf) return;
  const rect = $('bCanvas').getBoundingClientRect();
  BV.mouse = { x: (ev.clientX - rect.left - BV.xf.ox) / BV.xf.s, y: (ev.clientY - rect.top - BV.xf.oy) / BV.xf.s };
}
function firePower(kind, x, y) {
  if (BV.sendPower) { BV.sendPower(kind, x, y); return; }
  if (BV.local && !usePower(BV.local, BV.myTeam, kind, x, y)) S.no();
}
function pressPower(kind) {
  const tm = BV.view && BV.view.teams[BV.myTeam];
  if (!tm || !tm.charges[kind] || BV.view.over) { S.no(); return; }
  if (POWERS[kind].aim) {
    BV.armed = BV.armed === kind ? null : kind;
    document.querySelectorAll('.pu').forEach((b) => b.classList.toggle('armed', b.dataset.pu === BV.armed));
  } else firePower(kind, 0, 0);
}

const MAX_SQUAD = 8;
function myTeamDef(name) {
  const pc = powerCharges();
  return { name: name || G.name || 'You', human: true, charges: { repair: pc, shield: pc, emp: pc, air: resLvl('air') ? pc : 0 } };
}
function myUnits(team) {
  return squad().slice(0, MAX_SQUAD).map((r) => ({ team, design: { head: r.head, body: r.body, arms: r.arms, legs: r.legs, color: r.color }, lvl: r.lvl, name: r.name, robotId: r.id, bonus: bonusNow() }));
}
function needSquad() {
  if (squad().length) return true;
  if (!G.robots.length) { toast('Build a robot in the 🔧 Workshop first!'); setTab('workshop'); }
  else { toast('All your robots are broken or benched. Repair them in 🤖 Army!'); setTab('army'); }
  S.no(); return false;
}
function startCampaign(i) {
  if (!needSquad()) return;
  if (i > G.beaten) return;
  const B = BASES[i];
  const ech = { repair: i >= 4 ? 1 : 0, shield: i >= 6 ? 1 : 0, emp: i >= 8 ? 1 : 0, air: i >= 9 ? 1 : 0 };
  const b = createBattle({
    mode: 'campaign', base: B, baseIdx: i, seed: (Math.random() * 1e9) | 0, limit: i === 9 ? 210 : 150,
    teams: [myTeamDef(), { name: B.name, bot: true, charges: ech }],
    units: myUnits(0).concat(campaignEnemies(i)),
  });
  openBattle(b, { local: true, myTeam: 0, onEnd: (bb) => finishCampaign(bb, i) });
  if (i === 9) toast('👑 MEGA-TRON appears!!', 3000);
}
function startArena(bots, diff) {
  if (!needSquad()) return;
  const mine = myUnits(0), myPow = armyPower(squad().slice(0, MAX_SQUAD));
  // bots are a bit weaker than you (and even weaker when there are 3 of them)
  const mult = [0.55, 0.8, 1][diff] * (bots > 1 ? 0.75 : 1);
  const teams = [myTeamDef()], units = mine.slice();
  const botNames = ['Bot Bolt', 'Bot Sparky', 'Bot Crusher'];
  for (let k = 1; k <= bots; k++) {
    teams.push({ name: botNames[k - 1], bot: true, charges: { repair: 1, shield: 1, emp: diff ? 1 : 0, air: diff === 2 ? 1 : 0 } });
    const col = COLORS[(k * 3 + 2) % COLORS.length];
    for (const a of botArmy(myPow * mult, Math.min(6, mine.length + 2))) units.push({ team: k, design: Object.assign({ color: col }, a.d), lvl: a.lvl, bonus: bonusNow() });
  }
  const b = createBattle({ mode: 'arena', seed: (Math.random() * 1e9) | 0, teams, units, limit: 150 });
  openBattle(b, { local: true, myTeam: 0, onEnd: (bb) => finishArena(bb, bots, diff) });
}
function gainXp(r, amt) {
  let ups = 0;
  r.xp += Math.round(amt * (1 + 0.4 * resLvl('training')));
  while (r.lvl < MAX_LVL && r.xp >= xpNeed(r.lvl)) { r.xp -= xpNeed(r.lvl); r.lvl++; ups++; }
  if (r.lvl >= MAX_LVL) r.xp = 0;
  return ups;
}
function robotReport(b, xpWin, xpLose, canBreak) {
  const won = b.winner === 0;
  let html = '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px">';
  for (const u of b.units) {
    if (u.team !== 0 || !u.robotId) continue;
    const r = G.robots.find((x) => x.id === u.robotId); if (!r) continue;
    const ups = gainXp(r, (won ? xpWin : xpLose) * (u.alive ? 1 : 0.5));
    G.stats.kills += u.kills;
    if (!u.alive && canBreak) r.broken = true;
    html += `<div class="card" style="padding:6px"><b>${esc(r.name)}</b> <span class="pill gold">Lv ${r.lvl}</span><br>
      <span class="small">💥 ${u.kills} KO · ${u.alive ? '<span style="color:#4dff88">OK</span>' : canBreak ? '<span style="color:#ff4d5e">BROKEN 🔧</span>' : 'knocked out'}</span>
      ${ups ? '<br><b style="color:#ffcc33">⬆ LEVEL UP!</b>' : ''}</div>`;
    if (ups) S.level();
  }
  return html + '</div>';
}
function finishCampaign(b, i) {
  const B = BASES[i], won = b.winner === 0, first = won && G.beaten === i;
  let coins = 0, extra = '';
  if (won) {
    coins = first ? B.reward : Math.round(B.reward * 0.25);
    earn(coins); G.stats.wins++;
    if (first) {
      G.beaten = i + 1;
      const parts = Object.values(PARTS).filter((p) => p.unlock === 'b:' + (i + 1));
      const res = RESEARCH.filter((r) => r.need === i + 1);
      if (parts.length) extra += `<p>📜 <b>New blueprint${parts.length > 1 ? 's' : ''}:</b> ${parts.map((p) => p.name).join(', ')} (in the Workshop)</p>`;
      if (res.length) extra += `<p>🔬 <b>New research:</b> ${res.map((r) => r.name).join(', ')}</p>`;
      if (i === 9) extra += '<p style="font-size:18px">👑 <b>YOU BEAT MEGA-TRON! YOU ARE THE ROBOT KING!</b> 👑</p><p>Keep playing: fight friends online, win trophies, and max out your army!</p>';
    }
  } else G.stats.losses++;
  const xp = Math.round(25 * Math.pow(1.6, i));
  const fought = b.units.filter((u) => u.team === 0 && u.robotId).map((u) => G.robots.find((r) => r.id === u.robotId)).filter(Boolean);
  const minePow = armyPower(fought);
  const rep = robotReport(b, xp, Math.round(xp / 3), true);
  won ? S.win() : S.lose();
  let tip = '';
  if (!won) {
    const theirs = enemyPower(i);
    tip = `<p class="dim">💡 Your army power: <b>⚡${fmt(minePow)}</b> · Enemy: <b>⚡${fmt(theirs)}</b>. ` +
      (b.why === 'time' ? 'You ran out of time! Bring more damage.' : 'Try: better parts, more robots, leveling up, Research, or use your power-ups!') + '</p>';
  }
  saveLocal();
  showModal(`<h2>${won ? '🏆 VICTORY!' : b.why === 'retreat' ? '🏳️ RETREAT' : '💥 DEFEAT'}</h2>
    <p>${won ? `You destroyed <b>${esc(B.name)}</b>!` : `${esc(B.name)} was too strong this time.`}</p>
    ${coins ? `<p style="font-size:18px">💰 <b style="color:#ffcc33">+${fmt(coins)}</b> coins${first ? '' : ' (replay reward)'}</p>` : ''}
    ${extra}${tip}${rep}`, [{ txt: 'Continue', cls: 'gold', fn: () => { closeBattle(); renderAll(); } }]);
}
function finishArena(b, bots, diff) {
  const won = b.winner === 0;
  let troph = 0, coins = 0;
  if (won) { troph = 8 + bots * 6 + diff * 6; coins = Math.round(Math.max(80, incomePerSec() * 40) * (0.7 + bots * 0.3) * (1 + diff * 0.3)); G.stats.arenaWins++; }
  else { troph = -Math.min(G.trophies, 4 + diff * 2); coins = Math.round(Math.max(20, incomePerSec() * 8)); }
  G.trophies += troph; earn(coins);
  const rep = robotReport(b, Math.round(15 * Math.pow(1.5, G.beaten)), Math.round(5 * Math.pow(1.5, G.beaten)), false);
  won ? S.win() : S.lose();
  saveLocal();
  showModal(`<h2>${won ? '🏆 ARENA WIN!' : '💥 You lost the arena'}</h2>
    <p>${won ? 'Your robots were the last ones standing!' : (b.winner >= 0 && b.teams[b.winner] ? `<b>${esc(b.teams[b.winner].name)}</b> won this one.` : 'Everyone got knocked out!')}</p>
    <p style="font-size:17px">🏆 <b>${troph >= 0 ? '+' : ''}${troph}</b> trophies · 💰 <b style="color:#ffcc33">+${fmt(coins)}</b></p>
    <p class="dim small">Arena robots don't break — it's just for fun and trophies.</p>${rep}`,
  [{ txt: '🔁 Again', cls: 'green', fn: () => { closeBattle(); startArena(bots, diff); } }, { txt: 'Continue', cls: 'gold', fn: () => { closeBattle(); renderAll(); } }]);
}
function retreat() {
  if (BV.online) { showModal('<h2>Leave the battle?</h2><p>You will leave the online room.</p>', [{ txt: 'Stay' }, { txt: 'Leave', cls: 'red', fn: () => { leaveRoom(); closeBattle(); setTab('online'); } }]); return; }
  const b = BV.local; if (!b || b.over) return;
  showModal('<h2>🏳️ Retreat?</h2><p>This counts as a loss.' + (b.mode === 'campaign' ? ' Robots that were destroyed stay broken.' : '') + '</p>',
    [{ txt: 'Keep fighting', cls: 'green' }, { txt: 'Retreat', cls: 'red', fn: () => { if (b.over) return; b.over = true; b.winner = 1; b.why = 'retreat'; BV.ended = true; BV.onEnd && BV.onEnd(b); } }]);
}

function partStatLine(p) {

  if (p.heal) bits.push('💚' + p.heal);

// ============================================================
//  ONLINE  (room codes, up to 4 players)
//  A free public "matchmaker" server (PeerJS) helps the computers find
//  each other, then they talk directly with WebRTC.
//  The host's computer runs the battle and sends it to everyone.
// ============================================================
const NET_VERSION = 1;
const Net = (function () {
  const CFG = { url: 'wss://0.peerjs.com/peerjs', key: 'peerjs', ice: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
  try { const m = location.search.match(/[?&]signal=([^&]+)/); if (m) CFG.url = decodeURIComponent(m[1]); } catch (e) { /* */ }
  if (window.RAT_SIGNAL) CFG.url = window.RAT_SIGNAL;
  let ws = null, hb = null, myId = null, hostId = null, role = null, joinTimer = null;
  const peers = new Map();
  const H = {};
  const emit = (ev, ...a) => { if (H[ev]) H[ev](...a); };
  const rid = (n) => Array.from({ length: n }, () => 'abcdefghijkmnpqrstuvwxyz23456789'[(Math.random() * 32) | 0]).join('');
  function sig(type, dst, payload) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type, dst, payload })); }
  function connectSignal(id) {
    return new Promise((resolve, reject) => {
      let done = false;
      const fail = (why) => { if (!done) { done = true; reject(why); } };
      try { ws = new WebSocket(`${CFG.url}?key=${CFG.key}&id=${id}&token=${rid(10)}&version=1.5.4`); } catch (e) { fail('blocked'); return; }
      const to = setTimeout(() => fail('timeout'), 10000);
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch (er) { return; }
        if (m.type === 'OPEN') { done = true; clearTimeout(to); resolve(); hb = setInterval(() => { if (ws && ws.readyState === 1) ws.send('{"type":"HEARTBEAT"}'); }, 5000); return; }
        if (m.type === 'ID-TAKEN') { clearTimeout(to); fail('taken'); return; }
        if (m.type === 'ERROR') { clearTimeout(to); fail('error'); return; }
        onSignal(m);
      };
      ws.onerror = () => { clearTimeout(to); fail('blocked'); };
      ws.onclose = () => { clearTimeout(to); fail('blocked'); if (done && role) emit('signalLost'); };
    });
  }
  function newPeer(pid) {
    const pc = new RTCPeerConnection({ iceServers: CFG.ice });
    const P = { pid, pc, dc: null, queue: [], remoteSet: false, open: false };
    peers.set(pid, P);
    pc.onicecandidate = (e) => { if (e.candidate) sig('CANDIDATE', pid, { c: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate }); };
    pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) drop(pid); };
    pc.ondatachannel = (e) => wire(P, e.channel);
    return P;
  }
  function wire(P, dc) {
    P.dc = dc;
    dc.onopen = () => { P.open = true; if (joinTimer) { clearTimeout(joinTimer); joinTimer = null; } emit('open', P.pid); };
    dc.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (er) { return; } emit('msg', P.pid, m); };
    dc.onclose = () => drop(P.pid);
  }
  function drop(pid) {
    const P = peers.get(pid); if (!P) return;
    peers.delete(pid);
    try { P.dc && P.dc.close(); } catch (e) { /* */ }
    try { P.pc.close(); } catch (e) { /* */ }
    emit('close', pid, P.open);
  }
  async function flush(P) { P.remoteSet = true; for (const c of P.queue) { try { await P.pc.addIceCandidate(c); } catch (e) { /* */ } } P.queue = []; }
  async function onSignal(m) {
    const src = m.src, pl = m.payload || {};
    if (m.type === 'OFFER' && role === 'host') {
      if (peers.size >= 3) { sig('ANSWER', src, { full: true }); return; }
      const P = newPeer(src);
      try {
        await P.pc.setRemoteDescription(pl.sdp); await flush(P);
        const ans = await P.pc.createAnswer(); await P.pc.setLocalDescription(ans);
        sig('ANSWER', src, { sdp: P.pc.localDescription });
      } catch (e) { drop(src); }
    } else if (m.type === 'ANSWER' && role === 'guest') {
      if (pl.full) { emit('fail', 'full'); return; }
      const P = peers.get(src); if (!P) return;
      try { await P.pc.setRemoteDescription(pl.sdp); await flush(P); } catch (e) { emit('fail', 'rtc'); }
    } else if (m.type === 'CANDIDATE') {
      const P = peers.get(src); if (!P || !pl.c) return;
      if (P.remoteSet) { try { await P.pc.addIceCandidate(pl.c); } catch (e) { /* */ } } else P.queue.push(pl.c);
    } else if (m.type === 'EXPIRE' || m.type === 'LEAVE') {
      if (role === 'guest' && src === hostId && !(peers.get(src) || {}).open) emit('fail', 'noroom');
    }
  }
  return {
    on(ev, fn) { H[ev] = fn; },
    get role() { return role; },
    get url() { return CFG.url; },
    async host(code) {
      role = 'host'; myId = 'ratroom' + code.toLowerCase();
      await connectSignal(myId);
    },
    async join(code) {
      role = 'guest'; myId = 'ratp' + rid(12); hostId = 'ratroom' + code.toLowerCase();
      await connectSignal(myId);
      const P = newPeer(hostId);
      wire(P, P.pc.createDataChannel('game'));
      const offer = await P.pc.createOffer(); await P.pc.setLocalDescription(offer);
      sig('OFFER', hostId, { sdp: P.pc.localDescription, v: NET_VERSION });
      joinTimer = setTimeout(() => { if (!(peers.get(hostId) || {}).open) emit('fail', 'p2p'); }, 20000);
    },
    send(pid, obj) { const P = peers.get(pid); if (P && P.open && P.dc.readyState === 'open') try { P.dc.send(JSON.stringify(obj)); } catch (e) { /* */ } },
    broadcast(obj) { const s = JSON.stringify(obj); for (const P of peers.values()) if (P.open && P.dc.readyState === 'open') try { P.dc.send(s); } catch (e) { /* */ } },
    get hostId() { return hostId; },
    leave() {
      role = null; if (joinTimer) clearTimeout(joinTimer); joinTimer = null;
      for (const pid of [...peers.keys()]) drop(pid);
      if (hb) clearInterval(hb); hb = null;
      if (ws) { try { ws.onclose = null; ws.close(); } catch (e) { /* */ } } ws = null;
    },
  };
})();

function cleanArmy(a) { // don't trust other computers too much

    .map((r) => ({ head: r.head, body: r.body, arms: r.arms, legs: r.legs, color: /^#[0-9a-f]{6}$/i.test(r.color) ? r.color : '#b8c2d6', lvl: clamp(r.lvl | 0, 1, MAX_LVL), name: String(r.name || 'Bot').slice(0, 18) }));

    charges: { repair: clamp(ch.repair | 0, 0, 3), shield: clamp(ch.shield | 0, 0, 3), emp: clamp(ch.emp | 0, 0, 3), air: clamp(ch.air | 0, 0, 3) } };
}

}
Net.on('open', (pid) => {

});

  } else if (Net.role === 'guest' && pid === Net.hostId) {

Net.on('msg', (pid, m) => {
  if (Net.role === 'host') {

      if (OL.players.length >= 4 || OL.inBattle) { Net.send(pid, { t: 'err', why: 'full' }); return; }
      const a = cleanArmy(m);

async function createRoom() {
  if (OL.busy) return;
  if (!needSquad()) return;
  saveName(); OL.busy = true; OL.err = ''; OL.msg = 'Connecting to the online server...'; renderOnline();
  for (let tries = 0; tries < 3; tries++) {
    const code = Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[(Math.random() * 24) | 0]).join('');
    try {
      await Net.host(code);
      OL.code = code; OL.state = 'lobby'; OL.busy = false; OL.msg = '';
      const a = cleanArmy(myArmyPayload());
      OL.players = [Object.assign({ pid: 'host', power: armyPower(a.robots, a.bonus) }, a)];
      OL.me = 'host'; S.join(); sendLobby(); return;
    } catch (why) { Net.leave(); if (why !== 'taken') { OL.busy = false; OL.msg = ''; OL.err = NET_FAIL[why] || NET_FAIL.error; renderOnline(); return; } }
  }

}

  catch (why) { Net.leave(); OL.err = NET_FAIL[why] || NET_FAIL.error; OL.msg = ''; renderOnline(); }

}

}
function addBot() {

function hostStart() {
  if (OL.players.length < 2) { toast('You need at least 2 players (add a bot!)'); S.no(); return; }
  const teams = [], units = [];
  OL.teamOf = {};
  OL.players.forEach((p, ti) => {
    OL.teamOf[p.pid] = ti;
    teams.push({ name: p.name, bot: !!p.bot, charges: Object.assign({}, p.charges) });
    for (const r of p.robots) units.push({ team: ti, design: { head: r.head, body: r.body, arms: r.arms, legs: r.legs, color: r.color }, lvl: r.lvl, name: r.name, bonus: p.bonus, robotId: p.pid === 'host' ? findMyRobotId(r) : undefined });
  });
  const b = createBattle({ mode: 'arena', seed: (Math.random() * 1e9) | 0, teams, units, limit: 150 });
  b.online = true; OL.battle = b; OL.inBattle = true; OL.snapT = 0; OL.evBuf = [];
  const setup = { seed: b.seed, limit: b.limit, teams: teams.map((t) => ({ name: t.name, charges: t.charges })), units: b.units.map((u) => ({ id: u.id, team: u.team, design: u.design, lvl: u.lvl, scale: u.scale, maxHp: u.maxHp, r: u.r, x: u.x, y: u.y, boss: u.boss })) };
  for (const p of OL.players) if (!p.bot && p.pid !== 'host') Net.send(p.pid, { t: 'start', setup, you: OL.teamOf[p.pid] });

}
function findMyRobotId(r) { const m = squad().find((x) => x.head === r.head && x.body === r.body && x.arms === r.arms && x.legs === r.legs && x.name === r.name); return m ? m.id : undefined; }

  const b = OL.battle; if (!b) return;

    u: b.units.map((u) => [u.id, r1(u.x), r1(u.y), r1(u.hp), r1(u.shield + u.pShield), (u.alive ? 1 : 0) | (u.moving ? 2 : 0) | (u.stunT > 0 ? 4 : 0) | (u.burnT > 0 ? 8 : 0), u.face]),

    units: s.units.map((u) => Object.assign({}, u, { hp: u.maxHp, alive: true, moving: false, face: u.x < 500 ? 1 : -1, tx: u.x, ty: u.y, shield: 0, pShield: 0, stunT: 0, burnT: 0 })),

function guestSnap(m) {
  const V = OL.guestView; if (!V || BV.view !== V) return;
  V.time = m.tm;
  const byId = new Map(V.units.map((u) => [u.id, u]));
  for (const [id, x, y, hp, sh, fl, face] of m.u) {
    const u = byId.get(id); if (!u) continue;
    u.tx = x; u.ty = y; u.hp = hp; u.shield = sh; u.alive = !!(fl & 1); u.moving = !!(fl & 2); u.stunT = fl & 4 ? 1 : 0; u.burnT = fl & 8 ? 1 : 0; u.face = face;

    const r = G.robots.find((x) => x.id === +el.dataset.id); if (!r) return;
    showModal(`<h2>✏️ Rename</h2><input type="text" id="renameIn" maxlength="18" value="${esc(r.name)}" style="width:100%">`,
      [{ txt: '🎲', keep: true, fn: () => ($('renameIn').value = randomName()) }, { txt: 'Save', cls: 'gold', fn: () => { r.name = ($('renameIn').value.trim() || r.name).slice(0, 18); renderArmy(); saveLocal(); } }]);
    setTimeout(() => $('renameIn') && $('renameIn').focus(), 50);
  },
  train(el) { const r = G.robots.find((x) => x.id === +el.dataset.id); if (!r || r.lvl >= MAX_LVL || !spend(trainCost(r))) return; r.lvl++; r.xp = 0; S.level(); toast(`🎓 <b>${esc(r.name)}</b> is now level ${r.lvl}!`); renderArmy(); saveLocal(); },
  refit(el) { const r = G.robots.find((x) => x.id === +el.dataset.id); if (!r) return; G.ws = { head: r.head, body: r.body, arms: r.arms, legs: r.legs, color: r.color, name: r.name, refit: r.id }; setTab('workshop'); },
  cancelRefit() { G.ws.refit = null; G.ws.name = ''; renderWorkshop(); },
  attack(el) { startCampaign(+el.dataset.i); },
  abots(el) { arenaBots = +el.dataset.n; renderBattleTab(); },
  adiff(el) { arenaDiff = +el.dataset.n; renderBattleTab(); },
  arena() { startArena(arenaBots, arenaDiff); },
  research(el) {
    const R = RES[el.dataset.id], lvl = resLvl(R.id);
    if (lvl >= R.cost.length || G.beaten < R.need || !spend(R.cost[lvl])) return;
    G.research[R.id] = lvl + 1; S.buy(); toast(`🔬 <b>${R.name}</b> researched!`); renderResearch(); saveLocal();
  },
  bspeed() { BV.speed = BV.speed >= 3 ? 1 : BV.speed + 1; $('bSpeed').textContent = '⏩ ' + BV.speed + 'x'; },
  bquit: retreat,
  olCreate: createRoom, olJoin: joinRoom, olLeave: leaveRoom, olAddBot: addBot, olDelBot: removeBot, olStart: hostStart,
};
document.addEventListener('click', (ev) => {
  Sfx.init();
  const t = ev.target;
  const m = t.closest('[data-modal]'); if (m) { S.click(); modalPress(+m.dataset.modal); return; }
  const tab = t.closest('[data-tab]'); if (tab) { ev.preventDefault(); S.click(); setTab(tab.dataset.tab); return; }
  const a = t.closest('[data-act]');
  if (a) { if (a.disabled) return; if (a.dataset.act !== 'crank') S.click(); ACTIONS[a.dataset.act] && ACTIONS[a.dataset.act](a, ev); updateTop(); return; }
  const part = t.closest('[data-part]');
  if (part) { const P = PARTS[part.dataset.part]; if (!isUnlocked(P.id)) { S.no(); toast('🔒 ' + unlockText(P.id) + ' to unlock ' + P.name); return; } G.ws[P.slot] = P.id; S.clank(); updateWorkshop(); return; }
  const col = t.closest('[data-color]');
  if (col) { G.ws.color = col.dataset.color; S.click(); renderWorkshop(); return; }
  const pu = t.closest('[data-pu]'); if (pu) { pressPower(pu.dataset.pu); return; }
  const emo = t.closest('[data-emo]'); if (emo) { sendEmote(emo.dataset.emo); return; }
});
document.addEventListener('change', (ev) => {
  const sq = ev.target.closest('[data-squad]');
  if (sq) {
    const r = G.robots.find((x) => x.id === +sq.dataset.squad);
    if (sq.checked && squad().length >= MAX_SQUAD) { sq.checked = false; toast(`Max ${MAX_SQUAD} robots can fight at once.`); S.no(); return; }
    r.squad = sq.checked; saveLocal(); renderArmy();
  }
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'wsName') G.ws.name = ev.target.value; });
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.id === 'joinCode') joinRoom();
  if (BV.view && !ev.target.closest('input,textarea')) {
    const k = { 1: 'repair', 2: 'shield', 3: 'emp', 4: 'air' }[ev.key];
    if (k && document.querySelector(`.pu[data-pu="${k}"]`)) pressPower(k);
  }
  if (ev.key === 'Escape' && BV.armed) { BV.armed = null; document.querySelectorAll('.pu').forEach((b) => b.classList.remove('armed')); }
});
$('bCanvas').addEventListener('pointerdown', battleClick);
$('bCanvas').addEventListener('pointermove', battleMove);
$('factoryCanvas').addEventListener('pointerdown', () => ACTIONS.crank($('crankBtn')));

// ============================================================
//  TITLE SCREEN
// ============================================================
let titleOn = true;
const titleBots = [];
function hideTitle() { titleOn = false; $('title').style.display = 'none'; }
function drawTitle(t) {
  const cv = $('titleCanvas'); if (!cv.clientWidth) return;
  const r = fitCanvas(cv), c = cv.getContext('2d'); c.setTransform(r, 0, 0, r, 0, 0);
  const W = cv.clientWidth, H = cv.clientHeight;
  c.clearRect(0, 0, W, H);
  if (!titleBots.length) {
    const heads = ['h_bolt', 'h_visor', 'h_cyclops', 'h_dome', 'h_brain', 'h_skull', 'h_crown'], bodies = ['b_can', 'b_box', 'b_round', 'b_armor', 'b_reactor', 'b_shield'];
    const arms = ['a_punch', 'a_blaster', 'a_saw', 'a_rocket', 'a_hammer', 'a_laser', 'a_tesla', 'a_flame', 'a_plasma'], legs = ['l_wheels', 'l_walker', 'l_treads', 'l_spider', 'l_jet', 'l_stomper'];
    for (let i = 0; i < 7; i++) titleBots.push({ d: { head: heads[i % heads.length], body: bodies[i % bodies.length], arms: arms[(i * 2) % arms.length], legs: legs[i % legs.length], color: COLORS[i] }, x: i * 110 });
  }
  c.fillStyle = '#ffffff10'; c.fillRect(0, H - 22, W, 3);
  const span = 7 * 110;
  for (const b of titleBots) {
    const x = ((b.x + t * 40) % span) - 60;
    drawRobot(c, b.d, x * (W + 120) / span, H - 22, 0.95, { t, walk: t * 6 + b.x, moving: true, face: 1, atk: Math.sin(t * 2 + b.x) > 0.95 ? 1 : 0 });
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT = performance.now(), slowT = 0, goalT = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  try {
    if (titleOn) drawTitle(t);
    else {
      factoryStep(dt);
      if (battleOpen()) { guestTick(dt); battleTick(dt); }
      else if (curTab === 'factory') drawFactory();
      else if (curTab === 'workshop') drawWorkshopPreview(t);
      updateTop();
      slowT -= dt; if (slowT <= 0) { slowT = 0.25; updateAfford(); }
      goalT -= dt; if (goalT <= 0) { goalT = 1; goalTick(); }
      saveT -= dt; if (saveT <= 0) { saveT = 10; saveLocal(); }
    }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
window.addEventListener('beforeunload', () => { if (!titleOn) saveLocal(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && !titleOn) saveLocal(); });
// for testing (window.RAT lets a test script look inside the game)
window.RAT = { get G() { return G; }, set G(v) { G = v; }, PARTS, BASES, createBattle, stepBattle, robotStats, campaignEnemies, enemyPower, armyPower, botArmy, startCampaign, startArena, makeSaveCode, readSaveCode, incomePerSec, BV, OL, Net, ACTIONS, setTab, fixState, afterLoad };
// ============================================================
//  CLOUD SAVE (only when the game runs as a claude.ai artifact:
//  your game is saved to your own Claude account, private to you)
// ============================================================
async function cloudInit() {
  if (!IN_ARTIFACT) return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  let snap;
  try { Cloud.ref = db.doc('data/users/' + uid + '/save'); snap = await Cloud.ref.get(); } catch (e) { Cloud.ref = null; return; }
  if (snap.exists) { try { Cloud.loaded = fixState(JSON.parse(snap.data().save)); Cloud.lastBody = cloudBody(Cloud.loaded); } catch (e) { /* broken save */ } }
  $('saveWarn').style.display = 'none';
  if (!Cloud.loaded) return;
  if (!Cloud.started) { $('playBtn').textContent = '▶ CONTINUE'; return; }
  // you started playing before the cloud answered: ask which game to keep
  if (cloudBody(Cloud.loaded) === cloudBody(G)) return;
  Cloud.hold = true;
  const L = Cloud.loaded, desc = (s) => `${s.beaten}/10 bases · ${s.robots.length} robots · 💰${fmt(s.coins)}`;
  showModal(`<h2>☁️ Found your saved game</h2><p>Your Claude account has a saved game:<br><b>${desc(L)}</b></p><p>The game you are playing now:<br><b>${desc(G)}</b></p><p class="small dim">Which one do you want to keep?</p>`,
    [{ txt: 'Load my saved game', cls: 'gold', fn: () => { G = fixState(JSON.parse(JSON.stringify(L))); Cloud.hold = false; afterLoad(false); } },
     { txt: 'Keep this one', fn: () => { Cloud.hold = false; cloudSave(); } }]);
}
const cloudBody = (s) => JSON.stringify(Object.assign({}, s, { last: 0 }));
function cloudSave() {
  if (!Cloud.ref || Cloud.hold || titleOn) return;
  Cloud.pending = true;
  if (!Cloud.busy) cloudFlush();
}
async function cloudFlush() {
  Cloud.busy = true;
  // at most one write every 30 seconds, and only when something changed
  await new Promise((r) => setTimeout(r, Math.max(1000, 30000 - (Date.now() - Cloud.lastWrite))));
  while (Cloud.pending && Cloud.ref && !Cloud.hold) {
    Cloud.pending = false;
    const body = cloudBody(G);
    if (body === Cloud.lastBody) continue;
    try { await Cloud.ref.set({ save: JSON.stringify(G), at: Date.now() }); Cloud.lastBody = body; Cloud.lastWrite = Date.now(); }
    catch (e) { if (!e || e.code !== 'unavailable') { Cloud.ref = null; } break; }
  }
  Cloud.busy = false;
}
cloudInit();

// title screen: CONTINUE if there is a save, and a warning if this page can't save
const CAN_SAVE = Store.set('robotArmyTycoon.test', '1');
if (Store.get(SAVE_KEY)) $('playBtn').textContent = '▶ CONTINUE';
if (!CAN_SAVE) $('saveWarn').style.display = '';
let remindT = 600;
setInterval(() => { if (!CAN_SAVE && !titleOn) { remindT -= 5; if (remindT <= 0) { remindT = 600; toast('💾 Don\'t forget: press <b>Save</b> and copy your save code!', 4000); } } }, 5000);
requestAnimationFrame(frame);

</script>

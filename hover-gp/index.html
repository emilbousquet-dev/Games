    box-shadow: 0 0 0 0.45vh #000, inset 0 0 2vh rgba(120,200,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 8vh; font-family: 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif; }

  .icount { position: absolute; right: -1vh; bottom: -1vh; font-size: 4vh; font-weight: normal; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
  .split .hitem { width: 9vh; height: 9vh; } .split .islot { font-size: 5.5vh; }
  .hmsg { position: absolute; left: 0; right: 0; top: 24%; text-align: center; font-size: 6vh; color: #fff; opacity: 0; transform: scale(0.6);

  .hbig { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-size: 20vh; opacity: 0; transform: scale(2); color: var(--gold);
    text-shadow: 5px 5px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 0 0 40px rgba(255,200,0,0.6); transition: opacity 0.2s, transform 0.3s cubic-bezier(.2,1.6,.4,1); }
  .hbig.show { opacity: 1; transform: scale(1); }

  .hboost { position: absolute; inset: 0; opacity: 0; transition: opacity 0.25s; box-shadow: inset 0 0 12vh rgba(255,140,40,0.35); }

  .hballoons .outtxt { font-family: var(--font); color: #ff4040; text-shadow: 3px 3px 0 #000; }

  /* ---------------- MENUS ---------------- */
  #menu { position: fixed; inset: 0; z-index: 20; display: none; overflow: auto; }
  .screen { min-height: 100%; padding: 3vh 4vw 4vh; display: flex; flex-direction: column; align-items: center; gap: 2vh;
    background: linear-gradient(90deg, rgba(10,6,30,0.82) 0%, rgba(10,6,30,0.55) 55%, rgba(10,6,30,0.1) 100%); }
  .s-title, .s-podium { background: radial-gradient(ellipse at 50% 100%, rgba(10,6,30,0) 30%, rgba(10,6,30,0.6) 100%); justify-content: center; }
  .s-chars, .s-kart { align-items: flex-start; background: linear-gradient(90deg, rgba(10,6,30,0.88) 0%, rgba(10,6,30,0.75) 48%, rgba(10,6,30,0) 70%); }
  .s-pause, .s-results, .s-settings, .s-howto { background: rgba(10,6,30,0.78); }
  .mtitle { margin: 0; font-weight: normal; font-size: clamp(26px, 5vh, 52px); letter-spacing: 1px; color: #fff; text-align: center;

  .s-chars .mtitle, .s-kart .mtitle { text-align: left; }
  .logo { display: flex; flex-direction: column; align-items: center; line-height: 0.9; position: relative; margin-top: 4vh; animation: float 3s ease-in-out infinite; }
  .logo .l1 { font-size: clamp(60px, 15vh, 170px); background: linear-gradient(#fff6c0, #ffcc1a 45%, #ff8a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 4px #2a0a40; filter: drop-shadow(0 8px 0 #ff2fd0) drop-shadow(0 14px 20px rgba(0,0,0,0.5)); letter-spacing: 4px; }
  .logo .l2 { font-size: clamp(30px, 7vh, 80px); color: #fff; -webkit-text-stroke: 3px #2a0a40; filter: drop-shadow(0 5px 0 #2af0ff); letter-spacing: 8px; }
  .logo .sig { position: absolute; right: -0.6em; top: -0.2em; font-size: clamp(40px, 9vh, 100px); color: #2af0ff; transform: rotate(14deg); text-shadow: 0 0 20px #2af0ff; }
  .logo.small { margin-top: 0; animation: none; } .logo.small .l1 { font-size: clamp(40px, 9vh, 90px); } .logo.small .l2 { font-size: clamp(20px, 4vh, 40px); } 
  @keyframes float { 50% { transform: translateY(-10px) rotate(-1deg); } }
  .mb { font-family: var(--font); font-size: clamp(16px, 2.6vh, 26px); color: #fff; cursor: pointer; border: 3px solid rgba(255,255,255,0.85); border-radius: 18px; padding: 0.55em 1.2em;
    background: linear-gradient(#5a3ad8, #3a1a9a); box-shadow: 0 5px 0 #1a0a4a, 0 8px 18px rgba(0,0,0,0.4); transition: transform 0.12s, box-shadow 0.12s, background 0.12s; outline: none; }
  .mb:hover, .mb.focus { transform: translateY(-3px) scale(1.04); background: linear-gradient(#ff5ad8, #c02aa8); box-shadow: 0 8px 0 #5a0a4a, 0 0 0 4px #ffcc1a, 0 10px 24px rgba(0,0,0,0.5); }
  .mb:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a0a4a; }
  .mb.big { font-size: clamp(22px, 3.6vh, 36px); padding: 0.5em 1.6em; background: linear-gradient(#ffd84a, #ff9a1a); color: #3a1a00; border-color: #fff; box-shadow: 0 6px 0 #a04a00, 0 10px 20px rgba(0,0,0,0.4); }
  .mb.big.focus, .mb.big:hover { background: linear-gradient(#fff07a, #ffb02a); box-shadow: 0 8px 0 #a04a00, 0 0 0 4px #2af0ff, 0 12px 24px rgba(0,0,0,0.5); }
  .mb.small { font-size: clamp(14px, 2vh, 20px); padding: 0.4em 1em; }
  .pulse { animation: pulse 1.2s infinite; } @keyframes pulse { 50% { transform: scale(1.08); } }
  .hint { font-size: clamp(12px, 1.8vh, 17px); color: #d8d0ff; text-align: center; max-width: 900px; opacity: 0.9; font-family: Arial, sans-serif; font-weight: bold; }
  .row { display: flex; gap: 1.2vw; align-items: center; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; gap: 1.6vh; min-width: 300px; }
  .coins { font-size: 2.4vh; display: flex; align-items: center; gap: 0.4em; }

  .grid2.narrow { grid-template-columns: repeat(2, minmax(200px, 300px)); }
  .grid5 { display: grid; grid-template-columns: repeat(5, minmax(120px, 200px)); gap: 1.4vw; }

  .mb.card { display: flex; flex-direction: column; align-items: center; gap: 0.2em; font-size: clamp(30px, 6vh, 54px); padding: 0.4em 0.3em 0.5em; }
  .mb.card b { font-weight: normal; font-size: clamp(16px, 2.8vh, 28px); }
  .mb.card small { font-family: Arial, sans-serif; font-weight: bold; font-size: clamp(10px, 1.5vh, 15px); opacity: 0.85; }
  .opts { display: flex; flex-direction: column; gap: 1.2vh; min-width: min(640px, 92vw); }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 1vw; background: rgba(255,255,255,0.08); border-radius: 14px; padding: 0.4vh 0.8vw; }
  .olab { font-size: clamp(14px, 2.3vh, 22px); color: #ffe9a0; }
  .mb.oval { min-width: 220px; padding: 0.3em 0.8em; } .mb.oval.wide { min-width: 320px; }
  .mb.oval b { font-weight: normal; color: #fff; margin: 0 0.4em; }
  /* character select */

  .results.small .rrow { font-size: 1.9vh; }
  @keyframes slidein { from { transform: translateX(-60px); opacity: 0; } }
  .bigtime { font-size: 10vh; color: #ffcc1a; text-shadow: 0 5px 0 #000; }

<script>
  // start the game! (add ?track=neon to the address to jump straight into a test race)
  HG.Game.init();
  const q = new URLSearchParams(location.search);
  if (q.has('track')) {
    const racers = [];
    const chars = HG.Chars.LIST.filter((c) => c.id !== 'sigma');
    const n = q.has('n') ? +q.get('n') : 11;
    for (let i = 0; i < n; i++) { const c = chars[i % chars.length]; racers.push({ name: c.name, charId: c.id, ctrl: 'cpu', color: c.kart, parts: { body: c.defaultBody || HG.Vehicles.BODIES[i % 9].id, engine: HG.Vehicles.ENGINES[i % 6].id, fins: HG.Vehicles.FINS[i % 5].id } }); }
    racers.push({ name: 'SIGMA', charId: 'sigma', ctrl: 'local', player: 0, color: '#ffcc1a', parts: { body: 'kart', engine: 'twin', fins: 'standard' } });
    if (q.has('p2')) racers.push({ name: 'KISSE KAT', charId: 'kisse', ctrl: 'local', player: 1, color: '#ffd23a', parts: { body: 'bike', engine: 'twin', fins: 'standard' } });
    HG.Menu.init();
    HG.Menu.startQuick({ track: q.get('track'), mode: 'vs', cc: +(q.get('cc') || 150), racers, skipIntro: q.has('skip') });
  } else HG.Menu.init();
</script>

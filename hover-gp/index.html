<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGMA HOVER GP</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #ffcc1a; --pink: #ff2fd0; --cyan: #2af0ff; --ink: #fff; --dark: #120f22;
    --font: 'Lilita One', 'Arial Black', Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; font-family: var(--font); user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; display: block; }
  #fps { position: fixed; right: 6px; bottom: 4px; font: 12px monospace; color: #0f0; z-index: 50; text-shadow: 0 0 2px #000; }

  /* ---------------- HUD ---------------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  .hview { position: absolute; overflow: hidden; }
  .hview.split + .hview.split { border-top: 3px solid #000; }
  .outline { -webkit-text-stroke: 0; }
  .hplace { position: absolute; right: 2.2vw; bottom: 1.5vh; font-size: 15vh; line-height: 1; color: var(--pc, #fff);
    text-shadow: 0 0.06em 0 rgba(0,0,0,0.5), 0 0 0.03em #000, 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000; }
  .hplace b { font-weight: normal; }
  .hplace i { font-style: normal; font-size: 0.42em; margin-left: 0.04em; }
  .hplace.pop { animation: pop 0.35s ease-out; }
  .split .hplace { font-size: 9vh; }
  @keyframes pop { 0% { transform: scale(1.5); } 60% { transform: scale(0.92); } 100% { transform: scale(1); } }
  .hlap { position: absolute; left: 2.2vw; bottom: 2vh; font-size: 5.5vh; text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
  .hlap span { font-size: 0.55em; color: var(--gold); }
  .hlap small { font-size: 0.6em; opacity: 0.9; }
  .hcoins { position: absolute; left: 2.2vw; bottom: 9.5vh; font-size: 4.5vh; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; display: flex; align-items: center; gap: 0.25em; }
  .hcoins small { font-size: 0.5em; color: var(--gold); margin-left: 0.3em; }
  .coinico { display: inline-flex; width: 1.1em; height: 1.1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6b0, #ffcc1a 50%, #c88a00); color: #8a5a00; font-style: normal; font-family: Georgia, serif; font-weight: bold;
    font-size: 0.85em; align-items: center; justify-content: center; text-shadow: none; box-shadow: 0 0 0 3px #000; }
  .split .hlap { font-size: 4vh; } .split .hcoins { font-size: 3.2vh; bottom: 7.5vh; }
  .htime { position: absolute; right: 2vw; top: 1.5vh; font-size: 3.6vh; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; letter-spacing: 1px; }
  .hitem { position: absolute; left: 2vw; top: 2vh; width: 13vh; height: 13vh; }
  .islot { position: absolute; inset: 0; border-radius: 22%; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.35), rgba(30,20,60,0.55)); border: 0.6vh solid #fff;
    box-shadow: 0 0 0 0.45vh #000, inset 0 0 2vh rgba(120,200,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 8vh; font-family: 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif; }
  .islot2 { position: absolute; left: 9.5vh; top: 8.5vh; width: 6.5vh; height: 6.5vh; border-radius: 22%; background: rgba(30,20,60,0.7); border: 0.4vh solid #fff; display: none; align-items: center; justify-content: center; font-size: 4vh; font-family: 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif; }
  .hitem.dragging .islot2 { display: flex; }
  .hitem.rolling .islot span { animation: roll 0.08s linear infinite; display: inline-block; }
  @keyframes roll { 0% { transform: translateY(-30%); opacity: 0.6; } 100% { transform: translateY(30%); opacity: 1; } }
  .icount { position: absolute; right: -1vh; bottom: -1vh; font-size: 4vh; font-weight: normal; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
  .split .hitem { width: 9vh; height: 9vh; } .split .islot { font-size: 5.5vh; }
  .hmsg { position: absolute; left: 0; right: 0; top: 24%; text-align: center; font-size: 6vh; color: #fff; opacity: 0; transform: scale(0.6);
    text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000; transition: opacity 0.25s, transform 0.25s; }
  .hmsg.show { opacity: 1; transform: scale(1); }
  .hmsg.trick { color: var(--gold); font-size: 5vh; top: 30%; }
  .hmsg .final { color: #ff4040; font-size: 1.3em; }
  .hbig { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-size: 20vh; opacity: 0; transform: scale(2); color: var(--gold);
    text-shadow: 5px 5px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 0 0 40px rgba(255,200,0,0.6); transition: opacity 0.2s, transform 0.3s cubic-bezier(.2,1.6,.4,1); }
  .hbig.show { opacity: 1; transform: scale(1); }
  .hbig.go { color: #40ff70; }
  .hbig.intro { top: auto; bottom: 14%; font-size: 7vh; color: #fff; }
  .hbig .trackname { display: inline-block; padding: 0.15em 0.8em; background: linear-gradient(90deg, rgba(255,47,208,0), rgba(255,47,208,0.85) 15%, rgba(80,40,255,0.85) 85%, rgba(80,40,255,0)); }
  .hbig.finishbig { font-size: 13vh; top: 30%; }
  .hbig .finish { background: linear-gradient(#fff 20%, #ffcc1a 60%, #ff8a00); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 3px #000; text-shadow: none; }
  .hbig small { display: block; font-size: 0.5em; color: #fff; }
  .split .hbig { font-size: 12vh; } .split .hbig.finishbig { font-size: 8vh; }
  .hwarn { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 6vh; color: #ff3030; opacity: 0; text-shadow: 3px 3px 0 #000, -3px -3px 0 #000; }
  .hwarn.show { opacity: 1; animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .htip { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); max-width: 80%; text-align: center; font-size: 2.6vh; padding: 0.5em 1.1em; border-radius: 1em;
    background: rgba(10,10,30,0.75); border: 2px solid rgba(255,255,255,0.4); opacity: 0; transition: opacity 0.3s; }
  .htip.show { opacity: 1; }
  .hmap { position: absolute; right: 1.5vw; top: 22%; width: 22vh; height: 22vh; opacity: 0.92; }
  .split .hmap { top: 8%; width: 15vh; height: 15vh; }
  .hlist { position: absolute; left: 1vw; top: 24%; font-size: 1.9vh; line-height: 1.35; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; opacity: 0.85; }
  .hlist div { display: flex; align-items: center; gap: 0.4em; }
  .hlist b { width: 1.4em; text-align: right; font-weight: normal; color: var(--gold); }
  .hlist i { width: 0.8em; height: 0.8em; border-radius: 50%; border: 1px solid #000; }
  .hlist .me { color: var(--gold); font-size: 1.15em; }
  .hsmoke { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 30% 40%, rgba(20,10,30,0.95) 0 20%, transparent 35%), radial-gradient(circle at 70% 60%, rgba(30,10,40,0.95) 0 22%, transparent 38%), radial-gradient(circle at 50% 80%, rgba(20,10,30,0.9) 0 18%, transparent 30%); transition: opacity 0.3s; }
  .hboost { position: absolute; inset: 0; opacity: 0; transition: opacity 0.25s; box-shadow: inset 0 0 12vh rgba(255,140,40,0.35); }
  .hballoons { position: absolute; left: 2.2vw; bottom: 2vh; font-size: 6vh; font-family: 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif; }
  .hballoons small { font-family: var(--font); font-size: 0.6em; text-shadow: 2px 2px 0 #000; }
  .hballoons .outtxt { font-family: var(--font); color: #ff4040; text-shadow: 3px 3px 0 #000; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="fps"></div>
<div id="menu"></div>

<script src="../lib/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/textures.js"></script>
<script src="js/themes.js"></script>
<script src="js/track.js"></script>
<script src="js/tracks.js"></script>
<script src="js/trackmesh.js"></script>
<script src="js/env.js"></script>
<script src="js/input.js"></script>
<script src="js/kart.js"></script>
<script src="js/ai.js"></script>
<script src="js/race.js"></script>
<script src="js/camera.js"></script>
<script src="js/view.js"></script>
<script src="js/hud.js"></script>
<script src="js/game.js"></script>
<script>
  HG.Game.init();
  // quick test race
  const racers = [];
  const cols = ['#ff3b3b', '#3bd0ff', '#ffd21a', '#7cff6a', '#ff7ae0', '#ff9a2a', '#a070ff', '#ffffff'];
  for (let i = 0; i < 7; i++) racers.push({ name: 'CPU ' + (i + 1), ctrl: 'cpu', color: cols[i] });
  racers.push({ name: 'YOU', ctrl: 'local', player: 0, color: '#ffcc1a' });
  HG.Game.startRace({ track: 'neon', mode: 'vs', cc: 150, racers, skipIntro: location.search.includes('skip') });
</script>
</body>
</html>

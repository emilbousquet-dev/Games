<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floppy Party</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
  <style>
    :root {
      --ink: #2a2140; --paper: #fffaf3; --paper2: #f2e8da; --yellow: #ffcf33; --blue: #4aa8ff; --green: #5cc44a;
      --shadow: 0 6px 0 rgba(42, 33, 64, .18);
      --font: 'Baloo 2', 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: var(--font); color: var(--ink); }
    canvas { display: block; }
    [hidden] { display: none !important; }
    .small { font-size: .85em; opacity: .8; }
    kbd { color: var(--ink); display: inline-block; min-width: 1.2em; padding: 0 .35em; border-radius: 6px; background: #fff; border: 2px solid var(--ink); border-bottom-width: 3px; font: 700 .82em var(--font); line-height: 1.3; text-align: center; }
    .ico { width: 1.05em; height: 1.05em; vertical-align: -0.16em; flex: none; }

    .ui { position: fixed; inset: 0; pointer-events: none; }
    .ui > * { pointer-events: auto; }
    .ui > .tags, .ui > .hud, .ui > .big, .ui > .sub, .ui > .toast, .ui > .corner { pointer-events: none; }
    .corner { position: fixed; right: 14px; bottom: 8px; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }

    /* name tags above heads */
    .tags { position: fixed; inset: 0; overflow: hidden; }
    .tag { position: absolute; left: 0; top: 0; background: var(--c); color: #fff; font-weight: 800; font-size: 14px; padding: 0 9px; border-radius: 999px; border: 2px solid #fff; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.3); box-shadow: 0 2px 0 rgba(0,0,0,.18); }

    /* score bar */
    .hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: calc(100% - 24px); }
    .modename { background: var(--paper); padding: 2px 16px; border-radius: 999px; font-weight: 800; font-size: 17px; box-shadow: var(--shadow); }
    .modename small { font-weight: 700; opacity: .6; margin-left: 4px; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .pill { display: inline-flex; align-items: center; gap: 5px; background: var(--c, #fff); color: #fff; padding: 1px 12px 1px 7px; border-radius: 999px; font-weight: 800; font-size: 16px; text-shadow: 0 1px 0 rgba(0,0,0,.28); border: 3px solid #fff; box-shadow: var(--shadow); }
    .pill .dot { width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px var(--c); }
    .pill.bot { --c: #8f86a3; padding-left: 12px; }
    .pill.team0 { --c: #ff5a5f; font-size: 22px; padding: 1px 16px; } .pill.team1 { --c: #4aa8ff; font-size: 22px; padding: 1px 16px; }
    .crowns { display: inline-flex; color: var(--yellow); filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)); }
    .outmark { display: inline-flex; opacity: .9; }
    .extra { display: flex; align-items: center; gap: 6px; background: rgba(42,33,64,.78); color: #fff; padding: 2px 14px; border-radius: 999px; font-weight: 700; font-size: 16px; }
    .fuse { display: inline-block; width: 90px; height: 10px; border-radius: 6px; background: rgba(255,255,255,.25); overflow: hidden; }
    .fuse i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a5f, #ffcf33); }

    /* big center text */
    .big { position: fixed; top: 36%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(48px, 11vw, 116px); font-weight: 800; color: #fff; white-space: nowrap; text-align: center; line-height: 1.05;
      -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); }
    .big.long { font-size: clamp(34px, 6.5vw, 72px); white-space: normal; width: max-content; max-width: 90vw; }
    .big.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
    .sub { position: fixed; top: calc(36% + clamp(44px, 8vw, 80px)); left: 50%; transform: translateX(-50%); background: var(--paper); padding: 4px 18px; border-radius: 14px; font-weight: 700; font-size: 19px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
    @keyframes pop { from { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); } to { transform: translate(-50%, -50%) scale(1) rotate(0); } }
    .toast { position: fixed; left: 50%; top: 112px; transform: translateX(-50%) scale(.6); background: var(--yellow); padding: 4px 18px; border-radius: 999px; font-weight: 800; font-size: 19px; opacity: 0; transition: .2s; box-shadow: var(--shadow); white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

    /* menu screens */
    .screen { z-index: 4; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding-inline: 16px; background: rgba(42, 33, 64, .28); }
    .screen.title { background: none; align-items: flex-start; padding-top: 5vh; }
    .card { background: var(--paper); border-radius: 30px; padding: 20px 28px 24px; box-shadow: 0 10px 0 rgba(42,33,64,.22); border: 5px solid #fff; text-align: center; width: min(560px, 100%); max-height: calc(100% - 40px); overflow: auto; box-sizing: border-box; }
    .card h1 { margin: 0 0 6px; font-size: 38px; line-height: 1.1; }
    .card .body { font-size: 18px; }
    .card .body p { margin: .4em 0; }
    .screen.title .card { background: rgba(255, 250, 243, .92); }
    .logo { display: inline-flex; flex-wrap: wrap; justify-content: center; column-gap: .3em; font-size: clamp(44px, 9vw, 86px); line-height: 1; }
    .logo .word { white-space: nowrap; }
    .logo b { display: inline-block; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); animation: bob 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * .08s); }
    .logo b:nth-child(5n+1) { color: #ff5a8a; } .logo b:nth-child(5n+2) { color: #ffcf33; } .logo b:nth-child(5n+3) { color: #6fd35a; } .logo b:nth-child(5n+4) { color: #4aa8ff; } .logo b:nth-child(5n+5) { color: #9b6bff; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 800 21px var(--font); color: var(--ink); background: var(--paper2); border: 4px solid transparent; border-radius: 18px; padding: 8px 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .08s; }
    .btn.small { font-size: 17px; padding: 4px 12px; }
    .btn.on, .btn:hover { background: var(--yellow); border-color: #fff; transform: scale(1.03); }
    .btn:focus-visible { outline: 3px solid var(--blue); }
    .btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.go.on, .btn.go:hover { background: #4bb33a; border-color: #fff; }
    .btn kbd { font-size: .6em; }

    /* pick a mini-game */
    .modes .card { width: min(900px, 100%); }
    .modes .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .btn.mode { flex-direction: column; justify-content: flex-start; gap: 2px; padding: 10px 10px 12px; }
    .btn.mode .art svg { width: 100%; max-width: 200px; height: auto; display: block; border-radius: 12px; }
    .btn.mode small { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
    .btn.wide { grid-column: 1 / -1; justify-self: center; }
    @media (max-width: 720px) { .modes .buttons { grid-template-columns: repeat(2, 1fr); } }

    /* how many bots */
    .setup-art svg { width: 220px; max-width: 100%; height: auto; border-radius: 14px; }
    .counter { display: inline-flex; align-items: center; gap: 12px; background: var(--paper2); border-radius: 18px; padding: 6px 14px; margin: 4px 0; }
    .counter .lbl { font-weight: 800; font-size: 20px; }
    .counter .count { font-size: 36px; min-width: 1.2em; }
    .round { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; color: var(--ink); display: grid; place-items: center; cursor: pointer; font-size: 20px; }
    .round:hover:not(:disabled) { background: var(--yellow); }
    .round:disabled { opacity: .3; cursor: default; }
    .who { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }

    /* results */
    .podium { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 10px; }
    .place { display: flex; align-items: center; gap: 8px; font-size: 20px; }
    .place b { font-size: 24px; min-width: 1.5em; text-align: left; }
    .medal { font-weight: 800; font-size: 15px; width: 42px; padding: 2px 0; border-radius: 10px; background: #e0d6ea; }
    .medal.m0 { background: #ffcf33; } .medal.m1 { background: #d8dde6; } .medal.m2 { background: #f0b27a; }
    .final { display: flex; gap: 14px; justify-content: center; }
    .team { color: #fff; border-radius: 20px; padding: 6px 20px; font-weight: 800; font-size: 22px; }
    .team b { display: block; font-size: 52px; line-height: 1; } .team.t0 { background: #ff5a5f; } .team.t1 { background: #4aa8ff; }
    .winner { font-size: 24px; font-weight: 800; margin: 8px 0; }
    .stars .ico { width: 1.3em; height: 1.3em; }

    /* lobby */
    .lobby { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .lobby-top { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(720px, calc(100% - 24px)); text-align: center; }
    .lobby-top h2 { margin: 0; font-size: 34px; line-height: 1; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
    .lobby-top p { margin: 0; background: rgba(255,250,243,.9); padding: 2px 14px; border-radius: 999px; font-weight: 700; }
    .online { background: var(--ink); color: #fff; border-radius: 14px; padding: 4px 16px; font-weight: 700; }
    .online b { color: var(--yellow); font-size: 1.3em; letter-spacing: 3px; }
    .slots { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .slot { position: relative; width: 190px; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); border: 4px solid var(--c, #fff); overflow: hidden; font-size: 14px; }
    .slot-head { display: flex; align-items: center; gap: 6px; background: var(--c); color: #fff; padding: 3px 8px; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
    .slot-head b { font-size: 17px; flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-num { font-weight: 800; font-size: 12px; background: rgba(255,255,255,.3); border-radius: 8px; padding: 0 6px; }
    .slot-row { display: grid; grid-template-columns: 42px 26px 1fr 26px; align-items: center; gap: 4px; padding: 3px 8px 0; }
    .slot-row .lbl { font-weight: 700; opacity: .6; text-align: left; font-size: 12px; }
    .slot-row .val { font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; overflow: hidden; }
    .slot-row .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--ink); flex: none; }
    .arrow { width: 26px; height: 24px; border-radius: 8px; border: 2px solid var(--ink); background: #fff; color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; font-size: 14px; }
    .arrow:hover { background: var(--yellow); }
    .slot-foot { padding: 3px 8px 6px; font-size: 12px; opacity: .8; line-height: 1.5; }
    .leave { border: 0; background: rgba(255,255,255,.3); color: #fff; font: 700 11px var(--font); border-radius: 8px; padding: 1px 7px; cursor: pointer; }
    .leave:hover { background: rgba(0,0,0,.25); }
    .slot.empty { border: 4px dashed #cbbfae; background: rgba(255,250,243,.82); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 112px; color: #6f6580; }
    .slot.empty .slot-num { background: #e6ddd0; color: #6f6580; margin-bottom: 2px; }
    .slot-join { font-weight: 800; font-size: 16px; display: flex; flex-direction: column; gap: 2px; }
    .slot-join small { font-weight: 600; font-size: 12px; line-height: 1.6; }
    .lobby-actions { display: flex; gap: 10px; }

    .field { font: 800 34px var(--font); letter-spacing: 8px; text-transform: uppercase; width: 5.5em; text-align: center; border: 4px solid var(--ink); border-radius: 14px; padding: 2px 8px; }
    .field.name { letter-spacing: 1px; text-transform: none; width: 8em; font-size: 26px; }

    .help { position: fixed; right: 12px; top: 12px; width: min(480px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; background: rgba(255,250,243,.97); border-radius: 20px; padding: 10px 18px 14px; box-shadow: var(--shadow); z-index: 6; font-size: 15px; box-sizing: border-box; }
    .help h2 { margin: 0; }
    .help table { border-collapse: collapse; width: 100%; }
    .help td, .help th { padding: 2px 6px; text-align: left; }
    .help tr:nth-child(even) td { background: rgba(0,0,0,.04); }
    @media (max-width: 820px) { .slot { width: 170px; } .corner { display: none; } }
    @media (prefers-reduced-motion: reduce) { .logo b, .big.pop { animation: none; } }
  </style>
</head>
<body>
  <script src="../lib/three.min.js"></script>
  <script src="lib/cannon-es.js"></script>
  <script src="lib/peerjs.min.js"></script>
  <script src="js/input.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/look.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/ragdoll.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bots.js"></script>
  <script src="js/modes/arena.js"></script>
  <script src="js/modes/soccer.js"></script>
  <script src="js/modes/heist.js"></script>
  <script src="js/modes/bomb.js"></script>
  <script src="js/modes/hill.js"></script>
  <script src="js/modes/lava.js"></script>
  <script src="js/net.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

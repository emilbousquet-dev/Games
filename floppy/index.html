<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Floppy Party - wobbly ragdoll party game</title>
  <meta name="description" content="A wobbly ragdoll party game with 42 silly mini-games for 1 to 4 players. Play on one computer or online with friends.">
  <meta name="theme-color" content="#ffcf33">
  <meta property="og:title" content="Floppy Party">
  <meta property="og:description" content="Punch, grab and throw your friends in 42 silly ragdoll mini-games. Free, in your browser, online with friends.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://emilbousquet-dev.github.io/Games/floppy/preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='44' rx='16' ry='17' fill='%23ff5a8a' stroke='%232a2140' stroke-width='4'/%3E%3Ccircle cx='32' cy='22' r='14' fill='%23ff5a8a' stroke='%232a2140' stroke-width='4'/%3E%3Ccircle cx='27' cy='21' r='4' fill='%23fff'/%3E%3Ccircle cx='37' cy='21' r='4' fill='%23fff'/%3E%3Ccircle cx='28' cy='22' r='2' fill='%232a2140'/%3E%3Ccircle cx='38' cy='22' r='2' fill='%232a2140'/%3E%3Cpath d='M27 28q5 4 10 0' stroke='%232a2140' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M22 11l6 2 4-7 4 7 6-2-2 6H24z' fill='%23ffcf33' stroke='%232a2140' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
  <style>
    :root {
      --ink: #2a2140; --paper: #fffaf3; --paper2: #f2e8da; --yellow: #ffcf33; --blue: #4aa8ff; --green: #5cc44a;
      --shadow: 0 6px 0 rgba(42, 33, 64, .18);
      --font: 'Baloo 2', 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: var(--font); color: var(--ink); }
    canvas { display: block; }
    [hidden] { display: none !important; }
    .small { font-size: .85em; opacity: .8; }
    kbd { color: var(--ink); display: inline-block; min-width: 1.2em; padding: 0 .35em; border-radius: 6px; background: #fff; border: 2px solid var(--ink); border-bottom-width: 3px; font: 700 .82em var(--font); line-height: 1.3; text-align: center; }
    .ico { width: 1.05em; height: 1.05em; vertical-align: -0.16em; flex: none; }

    .ui { position: fixed; inset: 0; pointer-events: none; }
    .ui > * { pointer-events: auto; }
    .ui > .tags, .ui > .hud, .ui > .big, .ui > .sub, .ui > .toast, .ui > .corner { pointer-events: none; }
    .corner { position: fixed; right: 14px; bottom: 8px; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }

    /* name tags above heads */
    .tags { position: fixed; inset: 0; overflow: hidden; }
    .tag { position: absolute; left: 0; top: 0; background: var(--c); color: #fff; font-weight: 800; font-size: 14px; padding: 0 9px; border-radius: 999px; border: 2px solid #fff; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.3); box-shadow: 0 2px 0 rgba(0,0,0,.18); }

    /* score bar */
    .fps { position: fixed; left: 10px; bottom: 10px; z-index: 50; font: 800 13px/1 system-ui, sans-serif; color: #2a2140; background: #ffffffcc; padding: 5px 8px; border-radius: 8px; pointer-events: none; }
    .fps.bad { background: #ff5a5f; color: #fff; }
    .hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: calc(100% - 24px); }
    .modename { background: var(--paper); padding: 2px 16px; border-radius: 999px; font-weight: 800; font-size: 17px; box-shadow: var(--shadow); }
    .modename small { font-weight: 700; opacity: .6; margin-left: 4px; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .pill { display: inline-flex; align-items: center; gap: 5px; background: var(--c, #fff); color: #fff; padding: 1px 12px 1px 7px; border-radius: 999px; font-weight: 800; font-size: 16px; text-shadow: 0 1px 0 rgba(0,0,0,.28); border: 3px solid #fff; box-shadow: var(--shadow); }
    .pill .dot { width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px var(--c); }
    .pill.bot { --c: #8f86a3; padding-left: 12px; }
    .pill.team0 { --c: #ff5a5f; font-size: 22px; padding: 1px 16px; } .pill.team1 { --c: #4aa8ff; font-size: 22px; padding: 1px 16px; }
    .crowns { display: inline-flex; color: var(--yellow); filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)); }
    .outmark { display: inline-flex; opacity: .9; }
    .extra { display: flex; align-items: center; gap: 6px; background: rgba(42,33,64,.78); color: #fff; padding: 2px 14px; border-radius: 999px; font-weight: 700; font-size: 16px; }
    .fuse { display: inline-block; width: 90px; height: 10px; border-radius: 6px; background: rgba(255,255,255,.25); overflow: hidden; }
    .fuse i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a5f, #ffcf33); }

    /* big center text */
    .big { position: fixed; top: 36%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(48px, 11vw, 116px); font-weight: 800; color: #fff; white-space: nowrap; text-align: center; line-height: 1.05;
      -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); }
    .big.long { font-size: clamp(34px, 6.5vw, 72px); white-space: normal; width: max-content; max-width: 90vw; }
    .big.pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
    .sub { position: fixed; top: calc(36% + clamp(44px, 8vw, 80px)); left: 50%; transform: translateX(-50%); background: var(--paper); padding: 4px 18px; border-radius: 14px; font-weight: 700; font-size: 19px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
    @keyframes pop { from { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); } to { transform: translate(-50%, -50%) scale(1) rotate(0); } }
    .toast { position: fixed; left: 50%; top: 112px; transform: translateX(-50%) scale(.6); background: var(--yellow); padding: 4px 18px; border-radius: 999px; font-weight: 800; font-size: 19px; opacity: 0; transition: .2s; box-shadow: var(--shadow); white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

    /* menu screens */
    .screen { z-index: 4; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding-inline: 16px; background: rgba(42, 33, 64, .28); }
    .screen.title { background: none; align-items: flex-start; padding-top: 5vh; }
    @media (min-width: 801px) { .screen.title { justify-content: flex-start; align-items: center; padding: 0 0 0 5vw; } .screen.title .card { width: min(460px, 44vw); } }
    .card { background: var(--paper); border-radius: 30px; padding: 20px 28px 24px; box-shadow: 0 10px 0 rgba(42,33,64,.22); border: 5px solid #fff; text-align: center; width: min(560px, 100%); max-height: calc(100% - 40px); overflow: auto; box-sizing: border-box; }
    .card h1 { margin: 0 0 6px; font-size: 38px; line-height: 1.1; }
    .card .body { font-size: 18px; }
    .card .body p { margin: .4em 0; }
    .screen.title .card { background: rgba(255, 250, 243, .92); }
    .logo { display: inline-flex; flex-wrap: wrap; justify-content: center; column-gap: .3em; font-size: clamp(44px, 9vw, 86px); line-height: 1; }
    .logo .word { white-space: nowrap; }
    .logo b { display: inline-block; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); animation: bob 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * .08s); }
    .logo b:nth-child(5n+1) { color: #ff5a8a; } .logo b:nth-child(5n+2) { color: #ffcf33; } .logo b:nth-child(5n+3) { color: #6fd35a; } .logo b:nth-child(5n+4) { color: #4aa8ff; } .logo b:nth-child(5n+5) { color: #9b6bff; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 800 21px var(--font); color: var(--ink); background: var(--paper2); border: 4px solid transparent; border-radius: 18px; padding: 8px 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .08s; }
    .btn.small { font-size: 17px; padding: 4px 12px; }
    .btn.on, .btn:hover { background: var(--yellow); border-color: #fff; transform: scale(1.03); }
    .btn:focus-visible { outline: 3px solid var(--blue); }
    .btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .btn.go.on, .btn.go:hover { background: #4bb33a; border-color: #fff; }
    .btn kbd { font-size: .6em; }

    /* pick a mini-game */
    .modes .card { width: min(1080px, 100%); padding: 14px 18px 18px; }
    .modes .card h1 { font-size: 32px; }
    .modes .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 8px; }
    .btn.mode { flex-direction: column; justify-content: flex-start; gap: 1px; padding: 7px 8px 9px; font-size: 18px; border-radius: 16px; }
    .btn.mode .art svg { width: 100%; max-width: 150px; height: auto; display: block; border-radius: 10px; }
    .btn.mode small { font-weight: 600; font-size: 12.5px; line-height: 1.2; }
    .btn.extra { font-size: 17px; padding: 6px 8px; }
    .btn.extra.tour { background: #ffe08a; }
    .btn.extra .ico { width: 1.3em; height: 1.3em; }
    .btn.wide { grid-column: 1 / -1; justify-self: center; }
    @media (max-width: 860px) { .modes .buttons { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 620px) { .modes .buttons { grid-template-columns: repeat(2, 1fr); } }

    /* fun options */
    .fun .card { width: min(700px, 100%); }
    .fun .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn.opt { justify-content: flex-start; text-align: left; gap: 12px; font-size: 18px; }
    .btn.opt .txt { display: flex; flex-direction: column; }
    .btn.opt small { font-weight: 600; font-size: 13px; }
    .check { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; color: #fff; }
    .check.on { background: var(--green); }
    .check .ico { width: 20px; height: 20px; }
    .funline { font-weight: 800; color: #b0368a; }
    @media (max-width: 620px) { .fun .buttons { grid-template-columns: 1fr; } }

    /* surprise roulette and party tour */
    .roulette .setup-art svg { width: 280px; }
    .roulette h2 { font-size: 34px; margin: 8px 0 0; }
    .card .body h2 { margin: 12px 0 2px; font-size: 24px; }

    /* screen wipe */
    .wipe { position: fixed; inset: 0; z-index: 9; pointer-events: none; visibility: hidden;
      background: radial-gradient(circle at 25% 25%, rgba(255,255,255,.35) 0 7%, transparent 8%) 0 0 / 90px 90px, radial-gradient(circle at 75% 75%, rgba(155,107,255,.35) 0 7%, transparent 8%) 0 0 / 90px 90px, var(--yellow);
      clip-path: circle(0% at 50% 50%); }
    .wipe.closing { visibility: visible; animation: wipe-in .38s ease-in forwards; }
    .wipe.opening { visibility: visible; animation: wipe-out .48s ease-out forwards; }
    @keyframes wipe-in { from { clip-path: circle(0% at 50% 50%); } to { clip-path: circle(75% at 50% 50%); } }
    @keyframes wipe-out { from { clip-path: circle(75% at 50% 50%); } to { clip-path: circle(0% at 50% 50%); } }

    /* how to play (before each mini-game) */
    .intro .card { width: min(760px, 100%); }
    .intro-grid { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: center; text-align: left; }
    .intro-grid .setup-art svg { width: 240px; }
    .intro .goal { font-weight: 800; font-size: 19px; margin: 0 0 6px; }
    .tips { margin: 0; padding-left: 20px; font-size: 16.5px; line-height: 1.45; }
    .tips li::marker { color: #ff5a8a; }
    .keys-row { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; margin: 12px 0 4px; font-size: 15px; font-weight: 700; }
    .keys-row kbd { font-size: 13px; }
    .ready-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
    .ready-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--paper2); border-radius: 999px; padding: 3px 10px 3px 3px; }
    .ready-pill small { font-weight: 700; opacity: .6; }
    .ready-pill.ok { background: #c9f2b8; }
    .ready-pill .ico { color: #3a9a2a; width: 20px; height: 20px; }
    @media (max-width: 620px) { .intro-grid { grid-template-columns: 1fr; text-align: center; } .intro-grid .setup-art svg { width: 200px; } }

    /* results next to the 3D podium */
    .screen.results { background: none; justify-content: flex-end; padding-right: 3vw; }
    .screen.results .card { width: min(440px, 100%); padding: 16px 20px 18px; background: rgba(255, 250, 243, .94); }
    .screen.results .card h1 { font-size: 28px; }
    @media (max-width: 800px) { .screen.results { justify-content: center; align-items: flex-end; padding: 0 16px 12px; } .screen.results .card { max-height: 58%; } }
    .earn { color: #b07a00; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; gap: 2px; }
    .earn .ico { width: 1em; height: 1em; }

    /* coins, shop, achievements, settings */
    .coins { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .coins .ico { width: 1.3em; height: 1.3em; }
    .title-coins { margin: 10px 0 0; font-size: 17px; }
    .screen.title .buttons { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .screen.title .btn:not(.small) { flex-basis: 100%; }
    .lobby-coins { position: fixed; right: 16px; top: 12px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 12px; box-shadow: var(--shadow); font-size: 16px; }
    .shop .card { width: min(820px, 100%); }
    .shop .buttons { display: grid; grid-template-columns: repeat(20, 1fr); gap: 10px; }
    .shop .btn.hat { grid-column: span 5; }
    .shop .btn.wide { grid-column: 1 / -1; }
    .shop .btn.tab { grid-column: span 4; padding: 8px 4px; font-size: 16px; }
    .shop .btn.tab.cur { background: var(--yellow); box-shadow: inset 0 0 0 3px #2a2140; }
    .btn.hat svg.art { width: 110px; height: 110px; display: block; }
    .btn.hat { flex-direction: column; gap: 0; padding: 6px 6px 10px; font-size: 16px; }
    .btn.hat img { width: 110px; height: 110px; display: block; }
    .btn.hat small { font-weight: 800; display: inline-flex; align-items: center; gap: 4px; font-size: 15px; }
    .btn.hat small .ico { width: 1.1em; height: 1.1em; }
    .btn.hat:not(.owned):not(.afford) { opacity: .6; }
    .btn.hat.owned small { color: #3a9a2a; }
    .btn.hat.prize:not(.owned) { opacity: .75; background: #f3ecff; }
    .btn.hat.prize:not(.owned) small { color: #7a4ad0; }
    @media (max-width: 620px) { .shop .btn.hat { grid-column: span 10; } .shop .btn.tab { font-size: 13px; } }
    .story .card { width: min(900px, 100%); }
    .story .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .story .btn.wide { grid-column: 1 / -1; }
    .story-stars { font-size: 18px; margin: 4px 0; }
    .story-stars .ico { width: 1.1em; height: 1.1em; vertical-align: -2px; }
    .prizes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0 2px; font-size: 13px; }
    .prizes .prize { background: var(--paper2); border-radius: 999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 4px; }
    .prizes .prize.got { background: #d8f5cf; }
    .prizes .ico { width: 1.1em; height: 1.1em; }
    .world-title { grid-column: 1 / -1; text-align: left; font-weight: 900; font-size: 17px; padding: 4px 12px; border-radius: 12px; margin-top: 4px; color: var(--ink); }
    .w0 { --wc: #bdeaa8; } .w1 { --wc: #ffe7a3; } .w2 { --wc: #d6efff; } .w3 { --wc: #ffc9b3; } .w4 { --wc: #dde2ea; }
    .world-title, .btn.level { background: var(--wc); }
    .btn.level { flex-direction: column; gap: 1px; padding: 6px 6px 8px; font-size: 14px; position: relative; }
    .btn.level .lv-num { position: absolute; left: 8px; top: 5px; font-size: 12px; font-weight: 900; opacity: .6; }
    .btn.level .lv-art svg { width: 84px; height: 56px; display: block; border-radius: 8px; }
    .btn.level .lv-lock .ico { width: 40px; height: 56px; }
    .btn.level .stars .ico { width: 16px; height: 16px; }
    .btn.level.locked { opacity: .55; }
    .btn.level small { font-size: 11px; opacity: .7; }
    .btn.level.boss:not(.locked) { box-shadow: 0 0 0 3px #ff5a5f, var(--shadow); }
    .prize-won { font-size: 18px; color: #7a4ad0; }
    .prize-won .ico { width: 1.2em; height: 1.2em; vertical-align: -3px; }
    @media (max-width: 620px) { .story .buttons { grid-template-columns: repeat(2, 1fr); } }
    .achievements .card { width: min(720px, 100%); }
    .ach-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; text-align: left; margin-top: 8px; }
    .ach { display: flex; gap: 10px; align-items: center; background: var(--paper2); border-radius: 14px; padding: 8px 10px; opacity: .75; }
    .ach.done { background: #fff1b8; opacity: 1; }
    .ach .medal-ico .ico { width: 34px; height: 34px; }
    .ach .txt { display: flex; flex-direction: column; font-size: 15px; min-width: 0; }
    .ach small { font-weight: 600; font-size: 13px; }
    .prog { display: block; height: 8px; border-radius: 4px; background: #e0d6ea; margin-top: 3px; overflow: hidden; }
    .prog i { display: block; height: 100%; background: var(--green); }
    @media (max-width: 620px) { .ach-list { grid-template-columns: 1fr; } }
    .settings .card { width: min(560px, 100%); }
    .btn.set { justify-content: space-between; font-size: 18px; }
    .set-val { display: inline-flex; align-items: center; gap: 6px; }
    .set-val .ico { width: 1em; height: 1em; opacity: .6; }
    .vol { display: inline-flex; gap: 3px; }
    .vol i { width: 9px; height: 18px; border-radius: 3px; background: #e0d6ea; }
    .vol i.on { background: var(--green); }
    .credit-list p { margin: 8px 0; display: flex; flex-direction: column; font-size: 22px; }
    .credit-list small { font-size: 14px; opacity: .6; font-weight: 700; }
    .version { opacity: .5; }
    /* kart racing */
    .hs-curtain { position: fixed; inset: 0; z-index: 40; background: #1d1a2f; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; }
    .hs-curtain b { display: block; font: 900 42px/1.2 system-ui, sans-serif; } .hs-curtain small { font: 700 20px system-ui, sans-serif; opacity: .8; }
    .replay-bars { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
    .replay-bars i { position: absolute; left: 0; right: 0; height: 9vh; background: #000; }
    .replay-bars i.top { top: 0; } .replay-bars i.bot { bottom: 0; }
    .replay-bars b { position: absolute; top: 2vh; left: 24px; color: #ff5a5f; font: 900 30px system-ui, sans-serif; animation: blink 1s steps(2) infinite; }
    .replay-bars small { position: absolute; bottom: 3vh; right: 24px; color: #fff; font: 700 15px system-ui, sans-serif; opacity: .8; }
    @keyframes blink { 50% { opacity: .3; } }
    body.photo-mode .hud, body.photo-mode .tags, body.photo-mode .fps, body.photo-mode .touch { display: none !important; }
    .photo-ui { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; z-index: 30; pointer-events: none; }
    .photo-help { background: #2a2140dd; color: #fff; padding: 8px 16px; border-radius: 999px; font: 700 14px system-ui, sans-serif; max-width: calc(100% - 32px); text-align: center; }
    .photo-flash { position: fixed; inset: 0; background: #fff; z-index: 60; animation: flash .4s ease-out forwards; pointer-events: none; }
    @keyframes flash { to { opacity: 0; } }
    .photo-preview { position: fixed; top: 16px; right: 16px; z-index: 61; background: #fff; padding: 10px; border-radius: 14px; box-shadow: 0 6px 0 #2a2140; width: min(360px, calc(100% - 32px)); text-align: center; }
    .photo-preview img { width: 100%; border-radius: 8px; display: block; margin-bottom: 8px; }
    .btn.mode.picked { outline: 4px solid #5cc44a; }
    .pl-num { position: absolute; top: 6px; right: 8px; background: #5cc44a; color: #fff; border-radius: 999px; min-width: 26px; height: 26px; font: 900 15px/26px system-ui, sans-serif; text-align: center; box-shadow: 0 2px 0 #2a2140; }
    .btn.mode { position: relative; }
    .extra:has(.tug-bar) { flex-direction: column; gap: 4px; padding: 4px 16px; border-radius: 16px; }
    .tug-bar { position: relative; width: 240px; height: 14px; border-radius: 99px; background: linear-gradient(90deg, #ff5a5f 0 50%, #4aa8ff 50% 100%); border: 2px solid #fff; }
    .tug-bar.speed { background: linear-gradient(90deg, #fff, #ffcf33 50%, #5cc44a); }
    .tug-bar i { position: absolute; top: -5px; width: 8px; height: 20px; margin-left: -4px; background: #ffcf33; border: 2px solid #2a2140; border-radius: 3px; }
    .extra:has(.hud-tip) { flex-direction: column; gap: 2px; padding: 4px 16px; border-radius: 16px; }

    .kart-hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }

    .slot-foot { padding: 3px 8px 6px; font-size: 12px; opacity: .8; line-height: 1.5; }
